name: Build Skia SDK (Final Corrected)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    name: Build for ${{ matrix.target_os }}-${{ matrix.target_cpu }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: "win"
            target_cpu: "x64"
            artifact_name: "skia-win-rel-x64-sdk"
          - os: ubuntu-latest
            target_os: "linux"
            target_cpu: "x64"
            artifact_name: "skia-linux-rel-x64-sdk"
          - os: ubuntu-latest
            target_os: "android"
            target_cpu: "arm64"
            artifact_name: "skia-android-rel-arm64-sdk"
            android_api: 21

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git g++ clang ninja-build zip unzip \
            libfontconfig-dev libgl1-mesa-dev libvulkan-dev
          if [ "${{ matrix.target_os }}" = "android" ]; then
            sudo apt-get install -y openjdk-11-jdk
          fi
        shell: bash

      - name: Set up Android NDK (if building for Android)
        if: matrix.target_os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone Official Skia Repository and Depot Tools
        run: |
          git clone https://skia.googlesource.com/skia.git
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
        shell: bash

      - name: Set up depot_tools (Initialize)
        run: gclient
        shell: bash

      - name: Sync Skia dependencies
        working-directory: ./skia
        run: python3 tools/git-sync-deps

      - name: Configure Skia build with GN
        working-directory: ./skia
        run: |
          mkdir -p out/Release
          {
            echo "is_official_build = true"
            echo "is_debug = false"
            echo "skia_use_freetype = true"
            echo "skia_use_harfbuzz = true"
            echo "skia_pdf_subset_harfbuzz = true"
            echo "skia_enable_skottie = true"
            echo "skia_enable_svg = true"
            echo "skia_use_system_expat = false"
            echo "skia_use_system_icu = false"
            echo "skia_use_system_libjpeg_turbo = false"
            echo "skia_use_system_libpng = false"
            echo "skia_use_system_libwebp = false"
            echo "skia_use_system_zlib = false"
            echo "skia_use_system_freetype2 = false"
            echo "skia_use_system_harfbuzz = false"
            echo "target_os = \"${{ matrix.target_os }}\""
            echo "target_cpu = \"${{ matrix.target_cpu }}\""
          } > out/Release/args.gn
          if [ "${{ matrix.target_os }}" = "win" ]; then
            {
              echo ""
              echo "skia_enable_ganesh = false"
              echo "skia_enable_graphite = true"
              echo "skia_use_dawn = true"
              echo "dawn_enable_d3d11 = true"
              echo "dawn_enable_d3d12 = true"
              echo "dawn_enable_vulkan = true"
              echo 'extra_cflags_c = [ "/MT" ]'
              echo 'extra_cflags_cc = [ "/MT", "/std:c++20" ]'
              echo "cc = \"clang\""
              echo "cxx = \"clang++\""
              echo 'clang_win = "C:/Program Files/LLVM"'
            } >> out/Release/args.gn
          elif [ "${{ matrix.target_os }}" = "linux" ]; then
            {
              echo ""
              echo "skia_enable_ganesh = false"
              echo "skia_enable_graphite = true"
              echo "skia_use_gl = true"
              echo "skia_use_vulkan = true"
              echo 'extra_cflags_cc = [ "-std=c++20" ]'
            } >> out/Release/args.gn
          elif [ "${{ matrix.target_os }}" = "android" ]; then
            {
              echo ""
              echo "# Android-specific arguments (more complete)"
              echo "skia_enable_ganesh = false"
              echo "skia_enable_graphite = true"
              echo "skia_use_gl = true"
              echo "skia_use_vulkan = true"
              echo "skia_use_icu = true"
              echo "skia_enable_skshaper = true"
              echo "skia_enable_fontmgr_android = true"
              echo "skia_use_dng_sdk = false"
              echo "skia_use_piex = false"
              echo "android_api_level = ${{ matrix.android_api }}"
              echo "ndk = \"$ANDROID_NDK_ROOT\""
              echo 'extra_cflags_cc = [ "-std=c++20" ]'
            } >> out/Release/args.gn
          fi
          echo "--- Content of args.gn ---"
          cat out/Release/args.gn
          echo "--------------------------"
          gn gen out/Release
        shell: bash

      - name: Compile Skia with Ninja
        working-directory: ./skia
        # Explicitly build the 'skia' and 'modules' targets 
        # to bypass the failing //:skia.h action.
        run: ninja -C out/Release -j 4 skia modules

      - name: Package SDK
        working-directory: ./skia
        run: |
          SDK_DIR="../skia-sdk"
          mkdir -p "$SDK_DIR/include" "$SDK_DIR/lib" "$SDK_DIR/bin" "$SDK_DIR/LICENSES"
          cp -r include "$SDK_DIR/"
          cp -r modules "$SDK_DIR/include/"
          if [ -d "third_party/externals/dawn/include" ]; then
            mkdir -p "$SDK_DIR/include/third_party/externals/dawn"
            cp -r third_party/externals/dawn/include/* "$SDK_DIR/include/third_party/externals/dawn/"
          fi
          if [ -d "out/Release/gen/third_party/externals/dawn/include" ]; then
            mkdir -p "$SDK_DIR/include/gen/third_party/externals/dawn"
            cp -r out/Release/gen/third_party/externals/dawn/include/* "$SDK_DIR/include/gen/third_party/externals/dawn/"
          fi
          cp out/Release/*.a "$SDK_DIR/lib/" 2>/dev/null || true
          cp out/Release/*.so "$SDK_DIR/bin/" 2>/dev/null || true
          cp out/Release/*.lib "$SDK_DIR/lib/" 2>/dev/null || true
          cp out/Release/*.dll "$SDK_DIR/bin/" 2>/dev/null || true
          cp out/Release/icudtl.dat "$SDK_DIR/bin/" 2>/dev/null || true
          find . -maxdepth 3 -type f \( -name "LICENSE*" -o -name "COPYING*" \) -exec bash -c 'cp "$1" "'$SDK_DIR'/LICENSES/$(basename $(dirname "$1"))-$(basename "$1")"' _ {} \;
          {
            echo '# Skia SDK CMake config file (auto-generated by GitHub Actions)'
            echo 'get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)'
            echo 'set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")'
            echo 'set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")'
            echo 'set(Skia_BINARY_DIR "${Skia_SELF_DIR}/bin")'
            echo 'if (NOT TARGET Skia::Skia)'
            echo '    add_library(Skia::Skia INTERFACE IMPORTED)'
            echo '    target_include_directories(Skia::Skia INTERFACE'
            echo '            "${Skia_INCLUDE_DIR}"'
            echo '            "${Skia_INCLUDE_DIR}/third_party/externals/dawn"'
            echo '            "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn"'
            echo '    )'
            echo '    if(WIN32)'
            echo '        target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES SK_BUILD_FOR_WIN)'
            echo '        target_link_libraries(Skia::Skia INTERFACE'
            echo '                "${Skia_LIBRARY_DIR}/skia.lib"'
            echo '                "${Skia_LIBRARY_DIR}/skcms.lib"'
            echo '                "${Skia_LIBRARY_DIR}/dawn_native.dll.lib"'
            echo '                "${Skia_LIBRARY_DIR}/dawn_proc.dll.lib"'
            echo '                "${Skia_LIBRARY_DIR}/dawn_platform.dll.lib"'
            echo '                "${Skia_LIBRARY_DIR}/freetype.lib"'
            echo '                "${Skia_LIBRARY_DIR}/harfbuzz.lib"'
            echo '                d3d11.lib d3d12.lib dxguid.lib onecore.lib'
            echo '        )'
            echo '    elseif(UNIX AND NOT ANDROID)'
            echo '        target_link_libraries(Skia::Skia INTERFACE'
            echo '                "${Skia_LIBRARY_DIR}/libskia.a"'
            echo '                "${Skia_LIBRARY_DIR}/libskcms.a"'
            echo '                "${Skia_LIBRARY_DIR}/libfreetype.a"'
            echo '                "${Skia_LIBRARY_DIR}/libharfbuzz.a"'
            echo '                -lfontconfig -lfreetype -lGL -ldl -lpthread'
            echo '        )'
            echo '    elseif(ANDROID)'
            echo '         target_link_libraries(Skia::Skia INTERFACE'
            echo '                "${Skia_LIBRARY_DIR}/libskia.a"'
            echo '                "${Skia_LIBRARY_DIR}/libskcms.a"'
            echo '                "${Skia_LIBRARY_DIR}/libfreetype.a"'
            echo '                "${Skia_LIBRARY_DIR}/libharfbuzz.a"'
            echo '                -landroid -lEGL -lGLESv2 -ldl -llog'
            echo '        )'
            echo '    endif()'
            echo '    find_package(Vulkan QUIET)'
            echo '    if(Vulkan_FOUND)'
            echo '        message(STATUS "Found Vulkan SDK, adding Vulkan support to Skia::Skia target.")'
            echo '        target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)'
            echo '    else()'
            echo '        message(STATUS "Vulkan SDK not found. Skipping Vulkan support for Skia.")'
            echo '    endif()'
            echo 'endif()'
          } > "$SDK_DIR/SkiaConfig.cmake"
        shell: bash

      - name: Create ZIP archive
        run: 7z a -tzip "${{ matrix.artifact_name }}.zip" ./skia-sdk/*
        shell: bash

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
