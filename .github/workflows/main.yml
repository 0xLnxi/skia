# .github/workflows/build-skia-sdk.yml

name: Build Skia SDK Weekly

on:
  # 允许手动触发
  workflow_dispatch:
  # 每周日凌晨3:15 (UTC) 自动运行
  schedule:
    - cron: '15 3 * * 0'

jobs:
  build_skia:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: Windows
            arch: x64
            output_dir_name: Release-Clang-Optimized-Win
            
          - name: linux-x64
            runner: ubuntu-latest
            target: Linux
            arch: x64
            output_dir_name: Release-Clang-Optimized-Linux
            
          - name: android-arm64
            runner: ubuntu-latest
            target: Android
            arch: arm64
            output_dir_name: Release-Clang-Optimized-Android-arm64

          - name: android-x64
            runner: ubuntu-latest
            target: Android
            arch: x64
            output_dir_name: Release-Clang-Optimized-Android-x64

    steps:
      # ==================================================================
      #   步骤 1: 准备环境
      # ==================================================================
      - name: 1.1 检出 Skia 源代码
        uses: actions/checkout@v4

      - name: 1.2 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 1.3 设置 MSVC (仅 Windows)
        if: matrix.runner == 'windows-latest'
        uses: microsoft/setup-msvc@v1.1
        with:
          # 此 Action 会设置 VCToolsInstallDir, WindowsSDKDir, WindowsSDKVersion 等环境变量
          # 我们将在后续步骤中使用这些变量来动态配置 gn
          msvc-version: 'latest'

      - name: 1.4 安装系统依赖 (仅 Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang wget unzip python3-requests libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev

      - name: 1.5 设置 Android NDK (仅 Android)
        if: matrix.target == 'Android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # Skia M118+ 需要 NDK r25+，这里使用 r26b
          ndk-version: r26b
          
      - name: 1.6 设置 depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          DEPOT_TOOLS_PATH=$(pwd)/depot_tools
          echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH
          export PATH="$DEPOT_TOOLS_PATH:$PATH"
          # 验证 gclient 是否可用
          gclient --version

      - name: 1.7 确定 Ninja 作业数
        id: ninja-jobs
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # 在 PowerShell 中获取逻辑处理器数量
            CORE_COUNT=$(powershell -Command "(Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors")
          else
            # 在 Linux 中获取核心数
            CORE_COUNT=$(nproc)
          fi
          echo "使用 $CORE_COUNT 个核心进行编译"
          echo "count=$CORE_COUNT" >> $GITHUB_OUTPUT

      # ==================================================================
      #   步骤 2: 同步依赖项并编译
      # ==================================================================
      - name: 2.1 删除旧工具以强制重新同步
        shell: bash
        run: |
          echo "正在删除旧的 Skia 工具可执行文件以强制重新同步..."
          # 这是从您成功的本地脚本中借鉴的关键步骤，以确保工具总是最新的
          rm -f skia/bin/gn skia/bin/ninja skia/bin/clang-format
          rm -f skia/bin/gn.exe skia/bin/ninja.exe skia/bin/clang-format.exe

      - name: 2.2 同步 Skia 依赖项 (DEPS)
        working-directory: ./skia
        run: python3 tools/git-sync-deps

      - name: 2.3 配置 Skia 构建 (gn)
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          OUTPUT_DIR_NAME: ${{ matrix.output_dir_name }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: pwsh
        run: |
          # --- 定义基础 gn 参数 (与您的本地脚本匹配) ---
          $baseArgs = @'
          is_official_build = true
          is_debug = false
          is_trivial_abi = false
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_pdf_subset_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_enable_graphite = true
          skia_use_dawn = true
          skia_use_system_expat = false
          skia_use_system_icu = false
          skia_use_system_libjpeg_turbo = false
          skia_use_system_libpng = false
          skia_use_system_libwebp = false
          skia_use_system_zlib = false
          skia_use_system_freetype2 = false
          skia_use_system_harfbuzz = false
          use_allocator_shim = false
          extra_cflags_cc = [ "-std=c++20", "-D_USE_MATH_DEFINES" ]
          '@

          # --- 平台特定参数 ---
          $platformArgs = ""
          if ($env:TARGET -eq 'Windows') {
              # 从 setup-msvc action 设置的环境变量动态获取路径
              $clangWinPath = "$($env:VCToolsInstallDir)/../Llvm/x64".Replace('\', '/')
              $winVcPath = "$($env:VCToolsInstallDir)/..".Replace('\', '/')
              $winSdkPath = "$($env:WindowsSDKDir)".Replace('\', '/')
              $winSdkVersion = $env:WindowsSDKVersion
          
              $platformArgs = @"
          target_os = "win"
          target_cpu = "x64"
          cc = "clang"
          cxx = "clang++"
          clang_win = "$clangWinPath"
          win_vc = "$winVcPath"
          win_sdk = "$winSdkPath"
          win_sdk_version = "$winSdkVersion"
          extra_cflags_c = [ "/MD" ]
          extra_cflags_cc += [ "/MD" ] # 追加到基础定义中
          extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]
          dawn_enable_d3d11 = true
          dawn_enable_d3d12 = true
          dawn_enable_vulkan = true
          "@
          } elseif ($env:TARGET -eq 'Linux') {
              $platformArgs = @"
          target_os = "linux"
          target_cpu = "x64"
          cc = "clang"
          cxx = "clang++"
          extra_cflags_cc += [ "-fno-exceptions" ]
          dawn_enable_vulkan = true
          dawn_enable_opengles = true
          "@
          } elseif ($env:TARGET -eq 'Android') {
              $ndkPathForGn = $env:NDK_PATH.Replace('\', '/')
              $platformArgs = @"
          target_os = "android"
          target_cpu = "$($env:ARCH)"
          ndk = "$ndkPathForGn"
          ndk_api = 21
          extra_cflags_cc += [ "-fno-exceptions" ]
          dawn_enable_vulkan = true
          dawn_enable_opengles = true
          "@
          }
          
          $finalArgs = $baseArgs + "`n" + $platformArgs
          
          # --- 写入 args.gn 文件 ---
          $buildDir = "skia/out/$($env:OUTPUT_DIR_NAME)"
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          $argsFile = Join-Path $buildDir "args.gn"
          Set-Content -Path $argsFile -Value $finalArgs
          
          Write-Host "--- 最终 args.gn 内容 ---"
          Get-Content $argsFile
          Write-Host "---------------------------"
          
          # --- 生成构建文件 ---
          & gn gen $buildDir

      - name: 2.4 编译 Skia (ninja)
        run: ninja -C skia/out/${{ matrix.output_dir_name }} -j${{ steps.ninja-jobs.outputs.count }}

      # ==================================================================
      #   步骤 3: 打包为 SDK 并上传
      # ==================================================================
      - name: 3.1 打包 SDK (头文件, 库, CMake配置)
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          OUTPUT_DIR_NAME: ${{ matrix.output_dir_name }}
        shell: pwsh
        run: |
          $SourceDir = (Get-Location).Path
          $SkiaRoot = Join-Path $SourceDir "skia"
          $BuildOutputDir = Join-Path $SkiaRoot "out/$($env:OUTPUT_DIR_NAME)"
          $DestinationDir = Join-Path $SourceDir "skia-sdk"

          if (Test-Path $DestinationDir) {
              Remove-Item -Recurse -Force $DestinationDir
          }
          $SDKIncludeDir = Join-Path $DestinationDir "include"
          $SDKLibDir = Join-Path $DestinationDir "lib"
          $SDKBinDir = Join-Path $DestinationDir "bin"
          $SDKLicenseDir = Join-Path $DestinationDir "LICENSES"
          New-Item -ItemType Directory -Path $SDKIncludeDir, $SDKLibDir, $SDKBinDir, $SDKLicenseDir | Out-Null

          # --- 1. 拷贝头文件 ---
          Write-Host "正在拷贝头文件..."
          # 确保目标路径存在的情况下进行拷贝，以维持正确的目录结构
          Copy-Item -Path (Join-Path $SkiaRoot "include") -Destination $SDKIncludeDir -Recurse -Force
          Copy-Item -Path (Join-Path $SkiaRoot "modules") -Destination $SDKIncludeDir -Recurse -Force
          $dawnIncludeSource = Join-Path $SkiaRoot "third_party/externals/dawn/include"
          if (Test-Path $dawnIncludeSource) {
            Copy-Item -Path $dawnIncludeSource -Destination (Join-Path $SDKIncludeDir "third_party/externals/dawn") -Recurse -Force
          }
          $genDawnInclude = Join-Path $BuildOutputDir "gen/third_party/externals/dawn/include"
          if (Test-Path $genDawnInclude) {
              # 创建目标父目录
              $destParent = "gen/third_party/externals/dawn"
              New-Item -ItemType Directory -Path (Join-Path $SDKIncludeDir $destParent) -Force | Out-Null
              Copy-Item -Path $genDawnInclude -Destination (Join-Path $SDKIncludeDir $destParent) -Recurse -Force
          }

          # --- 2. 拷贝库文件和二进制文件 ---
          Write-Host "正在拷贝库文件和二进制文件..."
          if ($env:TARGET -eq "Windows") {
              Get-ChildItem -Path $BuildOutputDir -Filter "*.lib" | Copy-Item -Destination $SDKLibDir
              Get-ChildItem -Path $BuildOutputDir -Filter "*.dll" | Copy-Item -Destination $SDKBinDir
          } else { # Linux 和 Android
              Get-ChildItem -Path $BuildOutputDir -Filter "*.a" | Copy-Item -Destination $SDKLibDir
              Get-ChildItem -Path $BuildOutputDir -Filter "*.so" | Copy-Item -Destination $SDKBinDir
          }
          $icuDataFile = Join-Path $BuildOutputDir "icudtl.dat"
          if (Test-Path $icuDataFile) {
              Copy-Item -Path $icuDataFile -Destination $SDKBinDir -Force
          }

          # --- 3. 拷贝许可证文件 ---
          Write-Host "正在拷贝许可证文件..."
          Get-ChildItem -Path $SkiaRoot -Recurse -Include "LICENSE*", "COPYING*" | ForEach-Object {
              $DestFile = Join-Path $SDKLicenseDir "$($_.Directory.Name)-$($_.Name)"
              Copy-Item -Path $_.FullName -Destination $DestFile -Force
          }

          # --- 4. 生成 SkiaConfig.cmake (使用您脚本中的正确内容) ---
          Write-Host "正在生成 SkiaConfig.cmake..."
          $CmakeConfigFile = Join-Path $DestinationDir "SkiaConfig.cmake"
          $CmakeContent = ""
          switch ($env:TARGET) {
              'Windows' {
                  $CmakeContent = @'
# Skia SDK CMake配置文件 (为Windows生成)
get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
if (NOT TARGET Skia::Skia)
    add_library(Skia::Skia INTERFACE IMPORTED)
    target_include_directories(Skia::Skia INTERFACE
        "${Skia_INCLUDE_DIR}"
        "${Skia_INCLUDE_DIR}/modules"
        "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include"
        "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include"
    )
    target_link_libraries(Skia::Skia INTERFACE
        "${Skia_LIBRARY_DIR}/skia.lib"
        "${Skia_LIBRARY_DIR}/pathkit.lib"
        "${Skia_LIBRARY_DIR}/skresources.lib"
        "${Skia_LIBRARY_DIR}/skottie.lib"
        "${Skia_LIBRARY_DIR}/svg.lib"
        "${Skia_LIBRARY_DIR}/freetype2.lib"
        "${Skia_LIBRARY_DIR}/harfbuzz.lib"
        "${Skia_LIBRARY_DIR}/zlib.lib"
        "${Skia_LIBRARY_DIR}/dawn_native.dll.lib"
        "${Skia_LIBRARY_DIR}/dawn_proc.dll.lib"
        "${Skia_LIBRARY_DIR}/dawn_platform.dll.lib"
        "${Skia_LIBRARY_DIR}/allocator_core.lib"
        "${Skia_LIBRARY_DIR}/allocator_base.lib"
        "${Skia_LIBRARY_DIR}/allocator_shim.lib"
        "${Skia_LIBRARY_DIR}/raw_ptr.lib"
        "${Skia_LIBRARY_DIR}/common.lib"
        d3d11.lib d3d12.lib dxguid.lib onecore.lib
    )
    target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES SK_BUILD_FOR_WIN)
endif()
'@
              }
              'Linux' {
                  $CmakeContent = @'
# Skia SDK CMake配置文件 (为Linux生成)
get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
if (NOT TARGET Skia::Skia)
    add_library(Skia::Skia INTERFACE IMPORTED)
    target_include_directories(Skia::Skia INTERFACE
            "${Skia_INCLUDE_DIR}"
            "${Skia_INCLUDE_DIR}/modules"
            "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include"
            "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include"
    )
    target_link_libraries(Skia::Skia INTERFACE
            "-Wl,--start-group"
            "${Skia_LIBRARY_DIR}/libskia.a"
            "${Skia_LIBRARY_DIR}/libpathkit.a"
            "${Skia_LIBRARY_DIR}/libskresources.a"
            "${Skia_LIBRARY_DIR}/libskottie.a"
            "${Skia_LIBRARY_DIR}/libsvg.a"
            "${Skia_LIBRARY_DIR}/libfreetype2.a"
            "${Skia_LIBRARY_DIR}/libharfbuzz.a"
            "${Skia_LIBRARY_DIR}/libzlib.a"
            "${Skia_LIBRARY_DIR}/libdawn_native_static.a"
            "${Skia_LIBRARY_DIR}/libdawn_proc_static.a"
            "${Skia_LIBRARY_DIR}/libdawn_platform_static.a"
            "${Skia_LIBRARY_DIR}/liballocator_core.a"
            "${Skia_LIBRARY_DIR}/liballocator_base.a"
            "${Skia_LIBRARY_DIR}/liballocator_shim.a"
            "${Skia_LIBRARY_DIR}/libraw_ptr.a"
            "${Skia_LIBRARY_DIR}/libcommon.a"
            "-Wl,--end-group"
            fontconfig
            dl
            pthread
            EGL
            GLESv2
    )
    target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES)
endif()
'@
              }
              'Android' {
                  $CmakeContent = @'
# Skia SDK CMake配置文件 (为Android生成)
get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
if (NOT TARGET Skia::Skia)
    add_library(Skia::Skia INTERFACE IMPORTED)
    target_include_directories(Skia::Skia INTERFACE
        "${Skia_INCLUDE_DIR}"
        "${Skia_INCLUDE_DIR}/modules"
        "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include"
        "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include"
    )
    target_link_libraries(Skia::Skia INTERFACE
        "-Wl,--start-group"
        "${Skia_LIBRARY_DIR}/libskia.a"
        "${Skia_LIBRARY_DIR}/libpathkit.a"
        "${Skia_LIBRARY_DIR}/libskresources.a"
        "${Skia_LIBRARY_DIR}/libskottie.a"
        "${Skia_LIBRARY_DIR}/libsvg.a"
        "${Skia_LIBRARY_DIR}/libfreetype2.a"
        "${Skia_LIBRARY_DIR}/libharfbuzz.a"
        "${Skia_LIBRARY_DIR}/libzlib.a"
        "${Skia_LIBRARY_DIR}/libdawn_native_static.a"
        "${Skia_LIBRARY_DIR}/libdawn_proc_static.a"
        "${Skia_LIBRARY_DIR}/libdawn_platform_static.a"
        "${Skia_LIBRARY_DIR}/liballocator_core.a"
        "${Skia_LIBRARY_DIR}/liballocator_base.a"
        "${Skia_LIBRARY_DIR}/liballocator_shim.a"
        "${Skia_LIBRARY_DIR}/libraw_ptr.a"
        "${Skia_LIBRARY_DIR}/libcommon.a"
        "-Wl,--end-group"
        log 
        android 
        EGL 
        GLESv2
    )
    target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES)
endif()
'@
              }
          }
          Set-Content -Path $CmakeConfigFile -Value $CmakeContent
          
          Write-Host "✅ SDK for $($env:TARGET)-$($env:ARCH) 已成功打包到 $DestinationDir"


      - name: 3.2 上传 SDK 构件
        uses: actions/upload-artifact@v4
        with:
          name: skia-sdk-${{ matrix.name }}
          path: skia-sdk/
