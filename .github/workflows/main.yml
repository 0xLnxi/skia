name: Build and Package Skia SDK

on:
  # 允许手动从 Actions 标签页触发此工作流
  workflow_dispatch:
  # 每周日在世界标准时间(UTC)凌晨2点运行
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build-windows:
    name: Build Windows SDK (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Skia Source
        uses: actions/checkout@v4

      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Setup Vulkan SDK
        uses: lunarg/setup-vulkan@v1
        with:
          vulkan-query-version: 1.3.x

      - name: Sync Skia dependencies (gclient)
        run: python tools/git-sync-deps
        shell: bash
        
      - name: Build and Package Skia SDK
        shell: pwsh
        run: |
          # --- Helper Functions ---
          function Display-Step {
              param($message)
              Write-Host "`n==================================================================" -ForegroundColor Green
              Write-Host "  $message" -ForegroundColor Green
              Write-Host "==================================================================" -ForegroundColor Green
          }

          # --- Script Body ---
          $BuildOutputDir = Join-Path $PWD "out/Release-Clang-Optimized"
          $SDKDir = Join-Path $PWD "skia-sdk"
          
          Display-Step "Configuring build with GN"

          # 使用 Here-String 定义 GN 参数，清晰直观
          $gnArgs = @'
          cc = "clang"
          cxx = "clang++"
          is_official_build = true
          is_debug = false
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = false
          skia_enable_graphite = true
          skia_use_dawn = true
          dawn_enable_d3d11 = true
          dawn_enable_d3d12 = true
          dawn_enable_vulkan = true
          target_os = "win"
          target_cpu = "x64"
          extra_cflags_c = [ "/MT" ]
          extra_cflags_cc = [ "/MT", "-D_USE_MATH_DEFINES", "/std:c++20" ]
          extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]
          '@
          New-Item -ItemType Directory -Force -Path $BuildOutputDir | Out-Null
          Set-Content -Path (Join-Path $BuildOutputDir "args.gn") -Value $gnArgs
          gn gen $BuildOutputDir
          
          Display-Step "Compiling with Ninja"
          ninja -C $BuildOutputDir -j2

          Display-Step "Packaging SDK"
          # 创建目录
          if (Test-Path $SDKDir) { Remove-Item -Recurse -Force $SDKDir }
          $SDKIncludeDir = Join-Path $SDKDir "include"; $SDKLibDir = Join-Path $SDKDir "lib"; $SDKBinDir = Join-Path $SDKDir "bin"
          New-Item -ItemType Directory -Path $SDKIncludeDir, $SDKLibDir, $SDKBinDir | Out-Null
          
          # 拷贝文件
          Copy-Item -Path (Join-Path $PWD "include") -Destination $SDKIncludeDir -Recurse -Force
          Copy-Item -Path (Join-Path $PWD "modules") -Destination $SDKIncludeDir -Recurse -Force
          Copy-Item -Path (Join-Path $PWD "third_party/externals/dawn/include") -Destination (Join-Path $SDKIncludeDir "third_party/externals/dawn") -Recurse -Force
          Copy-Item -Path (Join-Path $BuildOutputDir "gen/third_party/externals/dawn/include") -Destination (Join-Path $SDKIncludeDir "gen/third_party/externals/dawn") -Recurse -Force
          Copy-Item -Path (Join-Path $BuildOutputDir "*.lib") -Destination $SDKLibDir -Force
          Copy-Item -Path (Join-Path $BuildOutputDir "*.dll") -Destination $SDKBinDir -Force
          Copy-Item -Path (Join-Path $BuildOutputDir "icudtl.dat") -Destination $SDKBinDir -Force
          
          Display-Step "Generating CMake config file"
          # 使用 Here-String 生成 CMake 配置文件
          $cmakeConfig = @'
          get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
          set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)
              target_include_directories(Skia::Skia INTERFACE "${Skia_INCLUDE_DIR}" "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include" "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include")
              target_link_libraries(Skia::Skia INTERFACE "${Skia_LIBRARY_DIR}/skia.lib" "${Skia_LIBRARY_DIR}/allocator_core.lib" "${Skia_LIBRARY_DIR}/allocator_base.lib" "${Skia_LIBRARY_DIR}/allocator_shim.lib" "${Skia_LIBRARY_DIR}/raw_ptr.lib" "${Skia_LIBRARY_DIR}/common.lib" "${Skia_LIBRARY_DIR}/zlib.lib" "${Skia_LIBRARY_DIR}/dawn_native.dll.lib" "${Skia_LIBRARY_DIR}/dawn_proc.dll.lib" "${Skia_LIBRARY_DIR}/dawn_platform.dll.lib" "${Skia_LIBRARY_DIR}/freetype2.lib" "${Skia_LIBRARY_DIR}/harfbuzz.lib" d3d11.lib d3d12.lib dxguid.lib onecore.lib)
              target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES SK_BUILD_FOR_WIN)
              find_package(Vulkan QUIET)
              if(Vulkan_FOUND)
                  message(STATUS "Found Vulkan SDK, adding Vulkan support to Skia::Skia target.")
                  target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)
              endif()
          endif()
          '@
          Set-Content -Path (Join-Path $SDKDir "SkiaConfig.cmake") -Value $cmakeConfig

      - name: Zip the SDK artifact
        run: Compress-Archive -Path skia-sdk -DestinationPath skia-win-rel-x64-sdk.zip
        shell: pwsh

      - name: Upload Windows SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-win-rel-x64-sdk
          path: skia-win-rel-x64-sdk.zip

  build-linux:
    name: Build Linux SDK (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia Source
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxrandr-dev libx11-xcb-dev libxcb-dri3-0 libxcb-present-dev zip
      - name: Setup depot_tools
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git && echo "$PWD/depot_tools" >> $GITHUB_PATH
      - name: Setup Vulkan SDK
        uses: lunarg/setup-vulkan@v1
      - name: Sync Skia dependencies (gclient)
        run: python tools/git-sync-deps
      - name: Build and Package Linux SDK
        run: |
          set -e # Exit on error
          BUILD_DIR="out/Release"
          SDK_DIR="skia-sdk"
          
          echo "--- Configuring build with GN ---"
          # 使用单引号包裹多行参数，非常清晰
          gn gen $BUILD_DIR --args='
          is_official_build=true
          is_debug=false
          skia_use_freetype=true
          skia_use_harfbuzz=true
          skia_enable_skottie=true
          skia_enable_svg=true
          skia_enable_ganesh=false
          skia_enable_graphite=true
          skia_use_dawn=true
          dawn_enable_vulkan=true
          skia_use_gl=true
          extra_cflags_cc=["-std=c++20"]
          '
          
          echo "--- Compiling with Ninja ---"
          ninja -C $BUILD_DIR -j2

          echo "--- Packaging SDK ---"
          mkdir -p $SDK_DIR/{lib,bin,include}
          cp -r include modules third_party/externals/dawn/include $SDK_DIR/include/
          cp -r $BUILD_DIR/gen/third_party/externals/dawn/include $SDK_DIR/include/
          cp $BUILD_DIR/*.a $BUILD_DIR/*.so* $SDK_DIR/lib/
          cp $BUILD_DIR/icudtl.dat $SDK_DIR/bin/
          
          echo "--- Generating CMake config file ---"
          # 使用 Here-Document 生成 CMake 配置文件
          cat <<'EOF' > $SDK_DIR/SkiaConfig.cmake
          get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
          set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)
              target_include_directories(Skia::Skia INTERFACE "${Skia_INCLUDE_DIR}" "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include" "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include")
              target_link_libraries(Skia::Skia INTERFACE "${Skia_LIBRARY_DIR}/libskia.a" "${Skia_LIBRARY_DIR}/liballocator_core.a" "${Skia_LIBRARY_DIR}/liballocator_base.a" "${Skia_LIBRARY_DIR}/liballocator_shim.a" "${Skia_LIBRARY_DIR}/libraw_ptr.a" "${Skia_LIBRARY_DIR}/libcommon.a" "${Skia_LIBRARY_DIR}/libzlib.a" "${Skia_LIBRARY_DIR}/libdawn_native.so" "${Skia_LIBRARY_DIR}/libdawn_proc.so" "${Skia_LIBRARY_DIR}/libdawn_platform.so" "${Skia_LIBRARY_DIR}/libfreetype2.a" "${Skia_LIBRARY_DIR}/libharfbuzz.a" EGL GLESv2)
              target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES)
              find_package(Vulkan QUIET)
              if(Vulkan_FOUND)
                  message(STATUS "Found Vulkan SDK, adding Vulkan support to Skia::Skia target.")
                  target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)
              endif()
          endif()
          EOF
      - name: Zip the SDK artifact
        run: zip -r skia-linux-rel-x64-sdk.zip skia-sdk
      - name: Upload Linux SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-linux-rel-x64-sdk
          path: skia-linux-rel-x64-sdk.zip

  build-android:
    name: Build Android SDK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia Source
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk zip
      - name: Setup depot_tools
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git && echo "$PWD/depot_tools" >> $GITHUB_PATH
      - name: Sync Skia dependencies (includes NDK)
        run: python tools/git-sync-deps
      - name: Build and Package Android SDK
        run: |
          set -e # Exit on error
          BUILD_DIR="out/Android-arm64"
          SDK_DIR="skia-sdk"
          NDK_PATH="third_party/android_tools/ndk"

          echo "--- Configuring build with GN ---"
          gn gen $BUILD_DIR --args='
          target_os="android"
          target_cpu="arm64"
          ndk="'$NDK_PATH'"
          ndk_api=26
          is_official_build=true
          is_debug=false
          skia_use_freetype=true
          skia_use_harfbuzz=true
          skia_enable_skottie=true
          skia_enable_svg=true
          skia_enable_ganesh=false
          skia_enable_graphite=true
          skia_use_dawn=true
          dawn_enable_vulkan=true
          skia_use_gl=true
          extra_cflags_cc=["-std=c++20", "-fno-exceptions", "-fno-rtti"]
          '
          
          echo "--- Compiling with Ninja ---"
          ninja -C $BUILD_DIR -j2
          
          echo "--- Packaging SDK ---"
          mkdir -p $SDK_DIR/{lib,bin,include}
          cp -r include modules third_party/externals/dawn/include $SDK_DIR/include/
          cp -r $BUILD_DIR/gen/third_party/externals/dawn/include $SDK_DIR/include/
          cp $BUILD_DIR/*.a $BUILD_DIR/*.so $SDK_DIR/lib/
          cp $BUILD_DIR/icudtl.dat $SDK_DIR/bin/
          
          echo "--- Generating CMake config file ---"
          cat <<'EOF' > $SDK_DIR/SkiaConfig.cmake
          get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
          set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)
              target_include_directories(Skia::Skia INTERFACE "${Skia_INCLUDE_DIR}" "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include" "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include")
              target_link_libraries(Skia::Skia INTERFACE "${Skia_LIBRARY_DIR}/libskia.a" "${Skia_LIBRARY_DIR}/liballocator_core.a" "${Skia_LIBRARY_DIR}/liballocator_base.a" "${Skia_LIBRARY_DIR}/liballocator_shim.a" "${Skia_LIBRARY_DIR}/libraw_ptr.a" "${Skia_LIBRARY_DIR}/libcommon.a" "${Skia_LIBRARY_DIR}/libzlib.a" "${Skia_LIBRARY_DIR}/libdawn_native.so" "${Skia_LIBRARY_DIR}/libdawn_proc.so" "${Skia_LIBRARY_DIR}/libdawn_platform.so" "${Skia_LIBRARY_DIR}/libfreetype2.a" "${Skia_LIBRARY_DIR}/libharfbuzz.a" EGL GLESv2 log)
              target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES)
          endif()
          EOF
      - name: Zip the SDK artifact
        run: zip -r skia-android-rel-arm64-sdk.zip skia-sdk
      - name: Upload Android SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-android-rel-arm64-sdk
          path: skia-android-rel-arm64-sdk.zip
