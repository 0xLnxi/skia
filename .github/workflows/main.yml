name: Build Skia SDK

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Runs on a schedule
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2:00 AM UTC

jobs:
  build:
    name: Build for ${{ matrix.target_os }}-${{ matrix.target_cpu }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: "win"
            target_cpu: "x64"
            artifact_name: "skia-win-rel-x64-sdk"
            gn_extra_args: >
              skia_enable_ganesh = false
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_d3d11 = true
              dawn_enable_d3d12 = true
              dawn_enable_vulkan = true
              extra_cflags_c = [ "/MT" ]
              extra_cflags_cc = [ "/MT", "/std:c++20" ]

          - os: ubuntu-latest
            target_os: "linux"
            target_cpu: "x64"
            artifact_name: "skia-linux-rel-x64-sdk"
            gn_extra_args: >
              skia_enable_ganesh = false
              skia_enable_graphite = true
              skia_use_gl = true
              skia_use_vulkan = true
              extra_cflags_cc = [ "-std=c++20" ]

          - os: ubuntu-latest
            target_os: "android"
            target_cpu: "arm64"
            artifact_name: "skia-android-rel-arm64-sdk"
            gn_extra_args: >
              skia_enable_ganesh = false
              skia_enable_graphite = true
              skia_use_gl = true
              skia_use_vulkan = true
              ndk = "/usr/local/lib/android/sdk/ndk/25.2.9519653"
              extra_cflags_cc = [ "-std=c++20" ]

    steps:
      - name: Checkout Skia Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up depot_tools (Clone)
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
        shell: bash

      - name: Set up depot_tools (Initialize)
        run: gclient
        shell: bash

      - name: Install Linux dependencies (if applicable)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libvulkan-dev

      - name: Sync Skia dependencies
        run: python3 tools/git-sync-deps

      - name: Configure Skia build with GN
        run: |
          # Common build arguments
          GN_ARGS="
          is_official_build = true
          is_debug = false
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_pdf_subset_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_use_system_expat = false
          skia_use_system_icu = false
          skia_use_system_libjpeg_turbo = false
          skia_use_system_libpng = false
          skia_use_system_libwebp = false
          skia_use_system_zlib = false
          skia_use_system_freetype2 = false
          skia_use_system_harfbuzz = false
          target_os = \"${{ matrix.target_os }}\"
          target_cpu = \"${{ matrix.target_cpu }}\"
          ${{ matrix.gn_extra_args }}
          "
          # On Windows, we need to specify the path to clang
          if [ "${{ runner.os }}" = "Windows" ]; then
            CLANG_PATH_ESCAPED=$(echo 'C:/Program Files/LLVM' | sed 's/\\/\\\\/g')
            GN_ARGS="$GN_ARGS
            cc = \"clang\"
            cxx = \"clang++\"
            clang_win = \"$CLANG_PATH_ESCAPED\"
            "
          fi
          echo "--- GN Arguments ---"
          echo "$GN_ARGS"
          echo "--------------------"
          
          gn gen out/Release --args="$GN_ARGS"
        shell: bash

      - name: Compile Skia with Ninja
        run: ninja -C out/Release -j 4

      - name: Package SDK
        run: |
          SDK_DIR="skia-sdk"
          mkdir -p "$SDK_DIR/include" "$SDK_DIR/lib" "$SDK_DIR/bin" "$SDK_DIR/LICENSES"

          echo "Copying header files..."
          cp -r include "$SDK_DIR/"
          cp -r modules "$SDK_DIR/include/"
          
          if [ -d "third_party/externals/dawn/include" ]; then
            mkdir -p "$SDK_DIR/include/third_party/externals/dawn"
            cp -r third_party/externals/dawn/include/* "$SDK_DIR/include/third_party/externals/dawn/"
          fi
          if [ -d "out/Release/gen/third_party/externals/dawn/include" ]; then
            mkdir -p "$SDK_DIR/include/gen/third_party/externals/dawn"
            cp -r out/Release/gen/third_party/externals/dawn/include/* "$SDK_DIR/include/gen/third_party/externals/dawn/"
          fi

          echo "Copying library and binary files..."
          cp out/Release/*.a "$SDK_DIR/lib/" 2>/dev/null || true
          cp out/Release/*.so "$SDK_DIR/bin/" 2>/dev/null || true
          cp out/Release/*.lib "$SDK_DIR/lib/" 2>/dev/null || true
          cp out/Release/*.dll "$SDK_DIR/bin/" 2>/dev/null || true
          cp out/Release/icudtl.dat "$SDK_DIR/bin/" 2>/dev/null || true

          echo "Copying license files..."
          find . -maxdepth 3 -type f \( -name "LICENSE*" -o -name "COPYING*" \) -exec bash -c 'cp "$1" "'$SDK_DIR'/LICENSES/$(basename $(dirname "$1"))-$(basename "$1")"' _ {} \;
          
          echo "Generating SkiaConfig.cmake..."
          cat > "$SDK_DIR/SkiaConfig.cmake" <<EOF
          # Skia SDK CMake config file (auto-generated by GitHub Actions)
          get_filename_component(Skia_SELF_DIR "\${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)

          set(Skia_INCLUDE_DIR "\${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "\${Skia_SELF_DIR}/lib")
          set(Skia_BINARY_DIR "\${Skia_SELF_DIR}/bin")

          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)

              target_include_directories(Skia::Skia INTERFACE
                      "\${Skia_INCLUDE_DIR}"
                      "\${Skia_INCLUDE_DIR}/third_party/externals/dawn"
                      "\${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn"
              )

              # Platform-specific libraries
              if(WIN32)
                  target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES SK_BUILD_FOR_WIN)
                  target_link_libraries(Skia::Skia INTERFACE
                          "\${Skia_LIBRARY_DIR}/skia.lib"
                          "\${Skia_LIBRARY_DIR}/skcms.lib"
                          "\${Skia_LIBRARY_DIR}/dawn_native.dll.lib"
                          "\${Skia_LIBRARY_DIR}/dawn_proc.dll.lib"
                          "\${Skia_LIBRARY_DIR}/dawn_platform.dll.lib"
                          "\${Skia_LIBRARY_DIR}/freetype.lib"
                          "\${Skia_LIBRARY_DIR}/harfbuzz.lib"
                          d3d11.lib d3d12.lib dxguid.lib onecore.lib
                  )
              elseif(UNIX AND NOT ANDROID)
                  target_link_libraries(Skia::Skia INTERFACE
                          "\${Skia_LIBRARY_DIR}/libskia.a"
                          "\${Skia_LIBRARY_DIR}/libskcms.a"
                          "\${Skia_LIBRARY_DIR}/libfreetype.a"
                          "\${Skia_LIBRARY_DIR}/libharfbuzz.a"
                          -lfontconfig -lfreetype -lGL -ldl -lpthread
                  )
              elseif(ANDROID)
                   target_link_libraries(Skia::Skia INTERFACE
                          "\${Skia_LIBRARY_DIR}/libskia.a"
                          "\${Skia_LIBRARY_DIR}/libskcms.a"
                          "\${Skia_LIBRARY_DIR}/libfreetype.a"
                          "\${Skia_LIBRARY_DIR}/libharfbuzz.a"
                          -landroid -lEGL -lGLESv2 -ldl -llog
                  )
              endif()

              # Find and link Vulkan if available
              find_package(Vulkan QUIET)
              if(Vulkan_FOUND)
                  message(STATUS "Found Vulkan SDK, adding Vulkan support to Skia::Skia target.")
                  target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)
              else()
                  message(STATUS "Vulkan SDK not found. Skipping Vulkan support for Skia.")
              endif()
          endif()
          EOF
        shell: bash

      - name: Create ZIP archive
        run: 7z a -tzip "${{ matrix.artifact_name }}.zip" ./skia-sdk/*
        shell: bash

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
