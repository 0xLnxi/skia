name: Build Skia SDK Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'

jobs:
  build_skia:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target_os: win
            target_cpu: x64
            output_dir_name: Release-Clang-Optimized-Win
            gn_args: |
              is_official_build = true
              is_debug = false
              is_trivial_abi = false
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_pdf_subset_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_ganesh = true
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_d3d11 = true
              dawn_enable_d3d12 = true
              dawn_enable_vulkan = true
              skia_use_system_expat = false
              skia_use_system_icu = false
              skia_use_system_libjpeg_turbo = false
              skia_use_system_libpng = false
              skia_use_system_libwebp = false
              skia_use_system_zlib = false
              skia_use_system_freetype2 = false
              skia_use_system_harfbuzz = false
              use_allocator_shim = false
              target_os = "win"
              target_cpu = "x64"
              cc = "clang"
              cxx = "clang++"
              clang_win = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64"
              win_vc = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC"
              win_sdk = "C:/Program Files (x86)/Windows Kits/10"
              win_sdk_version = "10.0.22621.0"
              extra_cflags_c = [ "/MD" ]
              extra_cflags_cc = [ "/MD", "-D_USE_MATH_DEFINES", "/std:c++20" ]
              extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]
          - name: linux-x64
            runner: ubuntu-latest
            target_os: linux
            target_cpu: x64
            output_dir_name: Release-Clang-Optimized-Linux
            gn_args: |
              is_official_build = true
              is_debug = false
              is_trivial_abi = false
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_pdf_subset_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_ganesh = true
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_vulkan = true
              dawn_enable_opengles = true
              dawn_use_x11 = true
              skia_use_system_expat = false
              skia_use_system_icu = false
              skia_use_system_libjpeg_turbo = false
              skia_use_system_libpng = false
              skia_use_system_libwebp = false
              skia_use_system_zlib = false
              skia_use_system_freetype2 = false
              skia_use_system_harfbuzz = false
              use_allocator_shim = false
              target_os = "linux"
              target_cpu = "x64"
              cc = "clang"
              cxx = "clang++"
              extra_cflags_cc = [ "-std=c++20", "-D_USE_MATH_DEFINES", "-fno-exceptions" ]
          - name: android-arm64
            runner: ubuntu-latest
            target_os: android
            target_cpu: arm64
            output_dir_name: Release-Clang-Optimized-Android
            gn_args: |
              is_official_build = true
              is_debug = false
              is_trivial_abi = false
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_pdf_subset_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_ganesh = true
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_vulkan = true
              dawn_enable_opengles = true
              skia_use_system_expat = false
              skia_use_system_icu = false
              skia_use_system_libjpeg_turbo = false
              skia_use_system_libpng = false
              skia_use_system_libwebp = false
              skia_use_system_zlib = false
              skia_use_system_freetype2 = false
              skia_use_system_harfbuzz = false
              use_allocator_shim = false
              target_os = "android"
              target_cpu = "arm64"
              ndk_api = 21
              extra_cflags_cc = [ "-std=c++20", "-D_USE_MATH_DEFINES", "-fno-exceptions", "-D_LIBCPP_HAS_NO_THREADS" ]

    steps:
      # ==================================================================
      #   步骤 1: 准备环境
      # ==================================================================
      - name: 1.1 检出 Skia 源代码 (此仓库)
        uses: actions/checkout@v4

      - name: 1.2 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang wget unzip python3-requests libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev libxrandr-dev libx11-xcb-dev libxcb-dri3-dev libxrender-dev libxshmfence-dev

      - name: 1.3 设置 depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          DEPOT_TOOLS_PATH=$(pwd)/depot_tools
          echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH
          export PATH="$DEPOT_TOOLS_PATH:$PATH"
          gclient --version

      - name: 1.4 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 1.5 设置 Android NDK (r26)
        if: matrix.target_os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26
      
      # ==================================================================
      #   步骤 2: 同步依赖项并编译
      # ==================================================================
      - name: 2.1 删除旧的工具二进制文件以强制重新同步
        shell: bash
        run: |
          echo "正在删除旧的 Skia 工具可执行文件以强制重新同步..."
          rm -f bin/gn bin/ninja bin/clang-format
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            rm -f bin/gn.exe bin/ninja.exe bin/clang-format.exe
          fi

      - name: 2.2 同步 Skia 依赖项 (DEPS)
        run: python3 tools/git-sync-deps

      - name: 2.3 配置 Skia 构建 (gn)
        env:
          GN_ARGS_CONTENT: ${{ matrix.gn_args }}
        shell: bash
        run: |
          OUTPUT_DIR="out/${{ matrix.output_dir_name }}"
          ARGS_FILE="$OUTPUT_DIR/args.gn"
          
          mkdir -p "$OUTPUT_DIR"
          
          # 写入从 matrix 传入的静态参数
          echo "$GN_ARGS_CONTENT" > "$ARGS_FILE"
          
          # 如果是 Android 构建，使用 Action 设置的环境变量追加 NDK 路径
          if [[ "${{ matrix.target_os }}" == "android" ]]; then
            echo "正在追加来自环境变量的 NDK 绝对路径..."
            echo "ndk = \"$ANDROID_NDK_LATEST_PATH\"" >> "$ARGS_FILE"
          fi
          
          echo "--- 最终 args.gn 内容 ---"
          cat "$ARGS_FILE"
          echo "---------------------------"
          
          # 生成 ninja 构建文件
          gn gen "$OUTPUT_DIR"

      - name: 2.4 编译 Skia (ninja) - 修复版本兼容性问题
        shell: bash
        run: |
          OUTPUT_DIR="out/${{ matrix.output_dir_name }}"
          
          # 检查是否存在本地 ninja 二进制文件
          if [[ -f "bin/ninja" ]]; then
            echo "使用本地 ninja 二进制文件进行编译..."
            ./bin/ninja -C "$OUTPUT_DIR" -j4
          elif [[ -f "bin/ninja.exe" ]]; then
            echo "使用本地 ninja.exe 二进制文件进行编译..."
            ./bin/ninja.exe -C "$OUTPUT_DIR" -j4
          else
            echo "本地 ninja 不存在，尝试使用 depot_tools 中的 ninja..."
            
            # 检查 depot_tools 中的 ninja 是否可用
            DEPOT_TOOLS_NINJA=$(which ninja)
            if [[ -n "$DEPOT_TOOLS_NINJA" ]]; then
              echo "找到 depot_tools ninja: $DEPOT_TOOLS_NINJA"
              
              # 检查是否是 Python 包装器，如果是则直接调用原始 ninja
              if [[ "$DEPOT_TOOLS_NINJA" == *"depot_tools"* ]]; then
                # 尝试找到原始的 ninja 二进制文件
                ORIGINAL_NINJA=""
                
                # 在常见位置查找原始 ninja
                for ninja_path in /usr/bin/ninja /usr/local/bin/ninja $(dirname "$DEPOT_TOOLS_NINJA")/ninja-linux64 $(dirname "$DEPOT_TOOLS_NINJA")/ninja-mac; do
                  if [[ -f "$ninja_path" && -x "$ninja_path" ]]; then
                    ORIGINAL_NINJA="$ninja_path"
                    break
                  fi
                done
                
                if [[ -n "$ORIGINAL_NINJA" ]]; then
                  echo "使用原始 ninja 二进制文件: $ORIGINAL_NINJA"
                  "$ORIGINAL_NINJA" -C "$OUTPUT_DIR" -j4
                else
                  echo "警告: 无法找到原始 ninja 二进制文件，尝试安装系统 ninja..."
                  
                  # 根据操作系统安装 ninja
                  if [[ "${{ runner.os }}" == "Linux" ]]; then
                    sudo apt-get update && sudo apt-get install -y ninja-build
                    ninja -C "$OUTPUT_DIR" -j4
                  elif [[ "${{ runner.os }}" == "macOS" ]]; then
                    brew install ninja
                    ninja -C "$OUTPUT_DIR" -j4
                  else
                    echo "错误: 无法为 ${{ runner.os }} 安装 ninja"
                    exit 1
                  fi
                fi
              else
                # 直接使用找到的 ninja
                ninja -C "$OUTPUT_DIR" -j4
              fi
            else
              echo "错误: 在 PATH 中找不到 ninja"
              exit 1
            fi
          fi
      
      # ==================================================================
      #   步骤 3: 打包为 SDK
      # ==================================================================
      - name: 3.1 创建并打包 SDK 文件
        shell: pwsh
        run: |
          $SourceDir = "${{ github.workspace }}"
          $BuildDir = "${{ github.workspace }}/out/${{ matrix.output_dir_name }}"
          $DestinationDir = "${{ github.workspace }}/skia-sdk"
          
          if (Test-Path $DestinationDir) {
              Remove-Item -Recurse -Force $DestinationDir
          }
          $SDKIncludeDir = Join-Path $DestinationDir "include"
          $SDKLibDir = Join-Path $DestinationDir "lib"
          $SDKBinDir = Join-Path $DestinationDir "bin"
          $SDKLicenseDir = Join-Path $DestinationDir "LICENSES"
          New-Item -ItemType Directory -Path $SDKIncludeDir, $SDKLibDir, $SDKBinDir, $SDKLicenseDir | Out-Null
          
          # 复制头文件 - 改进的目录结构
          Write-Host "=== 复制头文件 ==="
          
          # 复制主要 include 目录
          $MainInclude = Join-Path $SourceDir "include"
          if (Test-Path $MainInclude) {
              Copy-Item -Path $MainInclude -Destination (Join-Path $SDKIncludeDir "include") -Recurse -Force
              Write-Host "✓ 已复制主要头文件目录"
          }
          
          # 复制 modules 目录
          $ModulesDir = Join-Path $SourceDir "modules"
          if (Test-Path $ModulesDir) {
              Copy-Item -Path $ModulesDir -Destination (Join-Path $SDKIncludeDir "modules") -Recurse -Force
              Write-Host "✓ 已复制模块头文件"
          }
          
          # 复制 Dawn 头文件
          $DawnIncludeSource = Join-Path $SourceDir "third_party/externals/dawn/include"
          if (Test-Path $DawnIncludeSource) {
              $DawnDestPath = Join-Path $SDKIncludeDir "third_party/externals/dawn/include"
              New-Item -ItemType Directory -Path (Split-Path $DawnDestPath -Parent) -Force | Out-Null
              Copy-Item -Path $DawnIncludeSource -Destination $DawnDestPath -Recurse -Force
              Write-Host "✓ 已复制 Dawn 头文件"
          }
          
          # 复制生成的 Dawn 头文件
          $GenDawnInclude = Join-Path $BuildDir "gen/third_party/externals/dawn/include"
          if (Test-Path $GenDawnInclude) {
              $GenDawnDestPath = Join-Path $SDKIncludeDir "gen/third_party/externals/dawn/include"
              New-Item -ItemType Directory -Path (Split-Path $GenDawnDestPath -Parent) -Force | Out-Null
              Copy-Item -Path $GenDawnInclude -Destination $GenDawnDestPath -Recurse -Force
              Write-Host "✓ 已复制生成的 Dawn 头文件"
          }
          
          # 复制库文件和二进制文件
          Write-Host "=== 复制库文件和二进制文件 ==="
          if ($env:RUNNER_OS -eq "Windows") {
              $libFiles = Get-ChildItem -Path $BuildDir -Filter "*.lib" -ErrorAction SilentlyContinue
              if ($libFiles) {
                  $libFiles | Copy-Item -Destination $SDKLibDir
                  Write-Host "✓ 已复制 $($libFiles.Count) 个 .lib 文件"
              }
              $dllFiles = Get-ChildItem -Path $BuildDir -Filter "*.dll" -ErrorAction SilentlyContinue
              if ($dllFiles) {
                  $dllFiles | Copy-Item -Destination $SDKBinDir
                  Write-Host "✓ 已复制 $($dllFiles.Count) 个 .dll 文件"
              }
          } else {
              $staticLibs = Get-ChildItem -Path $BuildDir -Filter "*.a" -ErrorAction SilentlyContinue
              if ($staticLibs) {
                  $staticLibs | Copy-Item -Destination $SDKLibDir
                  Write-Host "✓ 已复制 $($staticLibs.Count) 个 .a 文件"
              }
              $sharedLibs = Get-ChildItem -Path $BuildDir -Filter "*.so" -ErrorAction SilentlyContinue
              if ($sharedLibs) {
                  $sharedLibs | Copy-Item -Destination $SDKBinDir
                  Write-Host "✓ 已复制 $($sharedLibs.Count) 个 .so 文件"
              }
          }
          
          # 复制 ICU 数据文件
          $IcuDataFile = Join-Path $BuildDir "icudtl.dat"
          if (Test-Path $IcuDataFile) {
              Copy-Item -Path $IcuDataFile -Destination $SDKBinDir -Force
              Write-Host "✓ 已复制 ICU 数据文件"
          }
          
          # 复制许可证文件
          Write-Host "=== 复制许可证文件 ==="
          try {
              Get-ChildItem -Path $SourceDir -Recurse -Include "LICENSE*", "COPYING*" -ErrorAction SilentlyContinue | ForEach-Object {
                  $DestFile = Join-Path $SDKLicenseDir "$($_.Directory.Name)-$($_.Name)"
                  Copy-Item -Path $_.FullName -Destination $DestFile -Force
              }
              Write-Host "✓ 已复制许可证文件"
          } catch {
              Write-Host "警告：复制许可证文件时出现问题: $($_.Exception.Message)"
          }
          
          # 输出最终统计信息
          Write-Host "=== 最终文件统计 ==="
          $libCount = (Get-ChildItem -Path $SDKLibDir -ErrorAction SilentlyContinue | Measure-Object).Count
          $binCount = (Get-ChildItem -Path $SDKBinDir -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "库文件: $libCount 个"
          Write-Host "二进制文件: $binCount 个"
          
          # 列出实际生成的库文件以便调试
          Write-Host "=== 实际库文件列表 ==="
          Get-ChildItem -Path $SDKLibDir -ErrorAction SilentlyContinue | ForEach-Object { 
              Write-Host "  - $($_.Name)"
          }

      - name: 3.2 生成 SkiaConfig.cmake (Windows)
        if: matrix.target_os == 'win'
        shell: pwsh
        run: |
          $content = @'
          # Skia SDK CMake 配置文件
          # 由 GitHub Actions 自动生成
          #
          # 定义一个 IMPORTED 目标 `Skia::Skia` 用于轻松集成
          #
          # 在 CMakeLists.txt 中的用法:
          #   find_package(Skia REQUIRED)
          #   target_link_libraries(your_target PRIVATE Skia::Skia)
          #
          
          get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
          
          set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
          set(Skia_BINARY_DIR "${Skia_SELF_DIR}/bin")
          
          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)
          
              # --- 包含目录 ---
              target_include_directories(Skia::Skia INTERFACE
                      "${Skia_INCLUDE_DIR}/include"
                      "${Skia_INCLUDE_DIR}/modules"
                      "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include"
                      "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include"
              )
          
              # --- 获取实际存在的库文件 ---
              set(SKIA_CORE_LIBS)
              
              # 检查主要库文件
              foreach(lib_name IN ITEMS skia pathops skresources skottie svg freetype2 harfbuzz zlib)
                  set(lib_path "${Skia_LIBRARY_DIR}/${lib_name}.lib")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
              
              # 检查 Dawn 库文件
              foreach(lib_name IN ITEMS dawn_native.dll dawn_proc.dll dawn_platform.dll)
                  set(lib_path "${Skia_LIBRARY_DIR}/${lib_name}.lib")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
              
              # 检查分配器和其他支持库
              foreach(lib_name IN ITEMS allocator_core allocator_base allocator_shim raw_ptr common)
                  set(lib_path "${Skia_LIBRARY_DIR}/${lib_name}.lib")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
          
              # --- 链接库 ---
              target_link_libraries(Skia::Skia INTERFACE
                      ${SKIA_CORE_LIBS}
                      d3d11.lib
                      d3d12.lib
                      dxguid.lib
                      onecore.lib
              )
          
              # --- 编译定义 ---
              target_compile_definitions(Skia::Skia INTERFACE
                      _USE_MATH_DEFINES
                      SK_BUILD_FOR_WIN
              )
          
              # --- 条件性添加 Vulkan 支持 ---
              find_package(Vulkan QUIET)
              if(Vulkan_FOUND)
                  message(STATUS "找到 Vulkan SDK，为 Skia::Skia 目标添加 Vulkan 支持。")
                  target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)
              else()
                  message(STATUS "未找到 Vulkan SDK。跳过 Skia 的 Vulkan 支持。")
              endif()
          endif()
          '@
          Set-Content -Path "${{ github.workspace }}/skia-sdk/SkiaConfig.cmake" -Value $content

      - name: 3.3 生成 SkiaConfig.cmake (Linux)
        if: matrix.target_os == 'linux'
        shell: bash
        run: |
          cat << 'EOF' > ${{ github.workspace }}/skia-sdk/SkiaConfig.cmake
          # Skia SDK CMake 配置文件
          # 由 GitHub Actions 自动生成
          #
          # 定义一个 IMPORTED 目标 `Skia::Skia` 用于轻松集成
          #
          # 在 CMakeLists.txt 中的用法:
          #   find_package(Skia REQUIRED)
          #   target_link_libraries(your_target PRIVATE Skia::Skia)
          #
          
          get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
          
          set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
          set(Skia_BINARY_DIR "${Skia_SELF_DIR}/bin")
          
          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)
          
              # --- 包含目录 ---
              target_include_directories(Skia::Skia INTERFACE
                      "${Skia_INCLUDE_DIR}/include"
                      "${Skia_INCLUDE_DIR}/modules"
                      "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include"
                      "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include"
              )
          
              # --- 获取实际存在的库文件 ---
              set(SKIA_CORE_LIBS)
              
              # 检查主要库文件 (注意：Linux 使用 libXXX.a 格式)
              foreach(lib_name IN ITEMS skia pathops skresources skottie svg freetype2 harfbuzz zlib)
                  set(lib_path "${Skia_LIBRARY_DIR}/lib${lib_name}.a")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
              
              # 检查 Dawn 库文件
              foreach(lib_name IN ITEMS dawn_native dawn_proc dawn_platform)
                  set(lib_path "${Skia_LIBRARY_DIR}/lib${lib_name}.a")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
              
              # 检查分配器和其他支持库
              foreach(lib_name IN ITEMS allocator_core allocator_base allocator_shim raw_ptr common)
                  set(lib_path "${Skia_LIBRARY_DIR}/lib${lib_name}.a")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
          
              # --- 链接库 (使用组链接解决循环依赖) ---
              target_link_libraries(Skia::Skia INTERFACE
                      "-Wl,--start-group"
                      ${SKIA_CORE_LIBS}
                      "-Wl,--end-group"
                      fontconfig
                      dl
                      pthread
                      EGL
                      GLESv2
                      X11
              )
          
              # --- 编译定义 ---
              target_compile_definitions(Skia::Skia INTERFACE
                      _USE_MATH_DEFINES
              )
          
              # --- 条件性添加 Vulkan 支持 ---
              find_package(Vulkan QUIET)
              if(Vulkan_FOUND)
                  message(STATUS "找到 Vulkan SDK，为 Skia::Skia 目标添加 Vulkan 支持。")
                  target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)
              else()
                  message(STATUS "未找到 Vulkan SDK。跳过 Skia 的 Vulkan 支持。")
              endif()
          endif()
          EOF

      - name: 3.4 生成 SkiaConfig.cmake (Android)
        if: matrix.target_os == 'android'
        shell: bash
        run: |
          cat << 'EOF' > ${{ github.workspace }}/skia-sdk/SkiaConfig.cmake
          # Skia SDK CMake 配置文件
          # 由 GitHub Actions 自动生成
          #
          # 定义一个 IMPORTED 目标 `Skia::Skia` 用于轻松集成
          #
          # 在 CMakeLists.txt 中的用法:
          #   find_package(Skia REQUIRED)
          #   target_link_libraries(your_target PRIVATE Skia::Skia)
          #
          
          get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
          
          set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
          set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
          set(Skia_BINARY_DIR "${Skia_SELF_DIR}/bin")
          
          if (NOT TARGET Skia::Skia)
              add_library(Skia::Skia INTERFACE IMPORTED)
          
              # --- 包含目录 ---
              target_include_directories(Skia::Skia INTERFACE
                      "${Skia_INCLUDE_DIR}/include"
                      "${Skia_INCLUDE_DIR}/modules"
                      "${Skia_INCLUDE_DIR}/third_party/externals/dawn/include"
                      "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include"
              )
          
              # --- 获取实际存在的库文件 ---
              set(SKIA_CORE_LIBS)
              
              # 检查主要库文件
              foreach(lib_name IN ITEMS skia pathops skresources skottie svg freetype2 harfbuzz zlib)
                  set(lib_path "${Skia_LIBRARY_DIR}/lib${lib_name}.a")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
              
              # 检查 Dawn 库文件
              foreach(lib_name IN ITEMS dawn_native dawn_proc dawn_platform)
                  set(lib_path "${Skia_LIBRARY_DIR}/lib${lib_name}.a")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
              
              # 检查分配器和其他支持库
              foreach(lib_name IN ITEMS allocator_core allocator_base allocator_shim raw_ptr common)
                  set(lib_path "${Skia_LIBRARY_DIR}/lib${lib_name}.a")
                  if(EXISTS "${lib_path}")
                      list(APPEND SKIA_CORE_LIBS "${lib_path}")
                  endif()
              endforeach()
          
              # --- 链接库 (使用组链接解决循环依赖) ---
              target_link_libraries(Skia::Skia INTERFACE
                      "-Wl,--start-group"
                      ${SKIA_CORE_LIBS}
                      "-Wl,--end-group"
                      log
                      android
                      EGL
                      GLESv2
              )
          
              # --- 编译定义 ---
              target_compile_definitions(Skia::Skia INTERFACE
                      _USE_MATH_DEFINES
              )
          
              # --- 条件性添加 Vulkan 支持 ---
              find_package(Vulkan QUIET)
              if(Vulkan_FOUND)
                  message(STATUS "找到 Vulkan SDK，为 Skia::Skia 目标添加 Vulkan 支持。")
                  target_link_libraries(Skia::Skia INTERFACE Vulkan::Vulkan)
              else()
                  message(STATUS "未找到 Vulkan SDK。跳过 Skia 的 Vulkan 支持。")
              endif()
          endif()
          EOF
  
      # ==================================================================
      #   步骤 4: 上传构件
      # ==================================================================
      - name: 4.1 上传 SDK 构件
        uses: actions/upload-artifact@v4
        with:
          name: skia-sdk-${{ matrix.name }}
          path: skia-sdk/
