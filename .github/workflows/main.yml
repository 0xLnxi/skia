# .github/workflows/build-skia.yml

name: Build Skia SDK

on:
  schedule:
    - cron: '0 3 * * 0' # Runs every Sunday at 3 AM UTC
  workflow_dispatch: # Allows manual runs

jobs:
  # ===============================================================
  #  Windows Build Job
  # ===============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Skia
        uses: actions/checkout@v4

      - name: Setup and Bootstrap depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$env:GITHUB_WORKSPACE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gclient.bat # <-- This is the added fix
        shell: pwsh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Skia dependencies
        run: python tools/git-sync-deps
        
      - name: Configure Skia Build (GN)
        run: |
          $clang_path = "C:\Program Files\LLVM"
          $gn_args = @"
          is_official_build = true
          is_debug = false
          target_os = "win"
          target_cpu = "x64"
          cc = "clang"
          cxx = "clang++"
          clang_win = "$clang_path"
          extra_cflags_c = [ "/MT" ]
          extra_cflags_cc = [ "/MT", "/std:c++20" ]
          extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_pdf_subset_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_enable_graphite = true
          skia_use_dawn = true
          dawn_enable_d3d11 = true
          dawn_enable_d3d12 = true
          dawn_enable_vulkan = true
          skia_use_system_libs = false
          "@
          New-Item -ItemType Directory -Force -Path "out/Release" | Out-Null
          Set-Content -Path "out/Release/args.gn" -Value $gn_args
          gn gen out/Release
        shell: pwsh

      - name: Compile Skia (Ninja)
        run: ninja -C out/Release -j (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
        shell: pwsh

      - name: Package SDK
        id: package
        run: |
          $S_ROOT="."
          $S_BUILD_DIR="out/Release"
          $S_SDK_DIR="skia-sdk"
          $S_SDK_ZIP="skia-win-rel-x64-sdk.zip"

          if (Test-Path $S_SDK_DIR) { Remove-Item -Recurse -Force $S_SDK_DIR }
          $SDK_INC = New-Item -ItemType Directory -Path (Join-Path $S_SDK_DIR "include")
          $SDK_LIB = New-Item -ItemType Directory -Path (Join-Path $S_SDK_DIR "lib")
          $SDK_BIN = New-Item -ItemType Directory -Path (Join-Path $S_SDK_DIR "bin")
          
          Copy-Item -Path (Join-Path $S_ROOT "include") -Destination $SDK_INC -Recurse -Force
          Copy-Item -Path (Join-Path $S_BUILD_DIR "*.lib") -Destination $SDK_LIB -Force
          Copy-Item -Path (Join-Path $S_BUILD_DIR "*.dll") -Destination $SDK_BIN -Force
          Copy-Item -Path (Join-Path $S_BUILD_DIR "icudtl.dat") -Destination $SDK_BIN -Force
          
          Compress-Archive -Path "$S_SDK_DIR/*" -DestinationPath $S_SDK_ZIP
          echo "zip_path=$S_SDK_ZIP" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Windows SDK
        uses: actions/upload-artifact@v4
        with:
          name: skia-win-rel-x64-sdk
          path: ${{ steps.package.outputs.zip_path }}

  # ===============================================================
  #  Linux Build Job
  # ===============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev

      - name: Setup and Bootstrap depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH
          gclient # <-- This is the added fix

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Skia dependencies
        run: python tools/git-sync-deps

      - name: Configure Skia Build (GN)
        run: |
          mkdir -p out/Release
          cat > out/Release/args.gn << EOF
          is_official_build = true
          is_debug = false
          target_os = "linux"
          target_cpu = "x64"
          cc = "clang"
          cxx = "clang++"
          extra_cflags = [ "-Wno-deprecated-declarations" ]
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_use_gl = true
          skia_use_egl = true
          skia_enable_vulkan = true
          skia_use_system_libs = false
          EOF
          gn gen out/Release

      - name: Compile Skia (Ninja)
        run: ninja -C out/Release -j $(nproc)

      - name: Package SDK
        id: package
        run: |
          S_SDK_DIR="skia-sdk"
          S_SDK_ZIP="skia-linux-rel-x64-sdk.zip"
          
          mkdir -p $S_SDK_DIR/include $S_SDK_DIR/lib
          cp -r include/* $S_SDK_DIR/include/
          cp out/Release/*.a $S_SDK_DIR/lib/
          cp out/Release/*.so $S_SDK_DIR/lib/
          
          zip -r $S_SDK_ZIP $S_SDK_DIR
          echo "zip_path=$S_SDK_ZIP" >> $GITHUB_OUTPUT

      - name: Upload Linux SDK
        uses: actions/upload-artifact@v4
        with:
          name: skia-linux-rel-x64-sdk
          path: ${{ steps.package.outputs.zip_path }}

  # ===============================================================
  #  Android Build Job
  # ===============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia
        uses: actions/checkout@v4
        
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Setup and Bootstrap depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH
          gclient # <-- This is the added fix

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Skia dependencies
        run: python tools/git-sync-deps

      - name: Configure Skia Build (GN)
        run: |
          mkdir -p out/Release
          cat > out/Release/args.gn << EOF
          is_official_build = true
          is_debug = false
          target_os = "android"
          target_cpu = "arm64"
          ndk = "${{ steps.setup-ndk.outputs.ndk-path }}"
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_use_gl = true
          skia_use_egl = true
          skia_enable_vulkan = true
          skia_use_system_libs = false
          EOF
          gn gen out/Release

      - name: Compile Skia (Ninja)
        run: ninja -C out/Release -j $(nproc)

      - name: Package SDK
        id: package
        run: |
          S_SDK_DIR="skia-sdk"
          S_SDK_ZIP="skia-android-rel-arm64-sdk.zip"

          mkdir -p $S_SDK_DIR/include $S_SDK_DIR/lib
          cp -r include/* $S_SDK_DIR/include/
          find out/Release -name "*.a" -exec cp {} $S_SDK_DIR/lib/ \;
          find out/Release -name "*.so" -exec cp {} $S_SDK_DIR/lib/ \;

          zip -r $S_SDK_ZIP $S_SDK_DIR
          echo "zip_path=$S_SDK_ZIP" >> $GITHUB_OUTPUT

      - name: Upload Android SDK
        uses: actions/upload-artifact@v4
        with:
          name: skia-android-rel-arm64-sdk
          path: ${{ steps.package.outputs.zip_path }}
