# .github/workflows/build-skia-sdk.yml

name: Build Skia SDK Weekly

on:
  # 允许手动触发
  workflow_dispatch:
  # 每周日凌晨3:15 (UTC) 自动运行
  schedule:
    - cron: '15 3 * * 0'

jobs:
  build_skia:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: Windows
            arch: x64
            output_dir_name: Release-Clang-Optimized-Win
            
          - name: linux-x64
            runner: ubuntu-latest
            target: Linux
            arch: x64
            output_dir_name: Release-Clang-Optimized-Linux
            
          - name: android-arm64
            runner: ubuntu-latest
            target: Android
            arch: arm64
            output_dir_name: Release-Clang-Optimized-Android-arm64

          - name: android-x64
            runner: ubuntu-latest
            target: Android
            arch: x64
            output_dir_name: Release-Clang-Optimized-Android-x64

    steps:
      # ==================================================================
      #   步骤 1: 准备环境
      # ==================================================================
      - name: 1.1 检出 Skia 源代码
        uses: actions/checkout@v4

      - name: 1.2 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 1.3 设置 MSVC (仅 Windows)
        if: matrix.runner == 'windows-latest'
        uses: microsoft/setup-msvc@v1.1
        with:
          msvc-version: 'latest'

      - name: 1.4 安装系统依赖 (仅 Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang wget unzip python3-requests libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev

      - name: 1.5 设置 Android NDK (仅 Android)
        if: matrix.target == 'Android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          
      - name: 1.6 设置 depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          DEPOT_TOOLS_PATH=$(pwd)/depot_tools
          echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH
          export PATH="$DEPOT_TOOLS_PATH:$PATH"
          gclient --version

      - name: 1.7 确定 Ninja 作业数
        id: ninja-jobs
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            CORE_COUNT=$(powershell -Command "(Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors")
          else
            CORE_COUNT=$(nproc)
          fi
          echo "使用 $CORE_COUNT 个核心进行编译"
          echo "count=$CORE_COUNT" >> $GITHUB_OUTPUT

      # ==================================================================
      #   步骤 2: 同步依赖项并编译
      # ==================================================================
      - name: 2.1 删除旧工具以强制重新同步
        shell: bash
        run: |
          echo "正在删除旧的 Skia 工具可执行文件以强制重新同步..."
          rm -f skia/bin/gn skia/bin/ninja skia/bin/clang-format
          rm -f skia/bin/gn.exe skia/bin/ninja.exe skia/bin/clang-format.exe

      - name: 2.2 同步 Skia 依赖项 (DEPS)
        working-directory: ./skia
        run: python3 tools/git-sync-deps

      - name: 2.3 配置 Skia 构建 (gn)
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          OUTPUT_DIR_NAME: ${{ matrix.output_dir_name }}
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: pwsh
        run: |
          # --- 定义基础 gn 参数 (使用字符串拼接) ---
          $baseArgs = "is_official_build = true`n" +
                      "is_debug = false`n" +
                      "is_trivial_abi = false`n" +
                      "skia_use_freetype = true`n" +
                      "skia_use_harfbuzz = true`n" +
                      "skia_pdf_subset_harfbuzz = true`n" +
                      "skia_enable_skottie = true`n" +
                      "skia_enable_svg = true`n" +
                      "skia_enable_ganesh = true`n" +
                      "skia_enable_graphite = true`n" +
                      "skia_use_dawn = true`n" +
                      "skia_use_system_expat = false`n" +
                      "skia_use_system_icu = false`n" +
                      "skia_use_system_libjpeg_turbo = false`n" +
                      "skia_use_system_libpng = false`n" +
                      "skia_use_system_libwebp = false`n" +
                      "skia_use_system_zlib = false`n" +
                      "skia_use_system_freetype2 = false`n" +
                      "skia_use_system_harfbuzz = false`n" +
                      "use_allocator_shim = false`n" +
                      "extra_cflags_cc = [ `" -std=c++20`", `" -D_USE_MATH_DEFINES`" ]`n"

          # --- 平台特定参数 ---
          $platformArgs = ""
          if ($env:TARGET -eq 'Windows') {
              $clangWinPath = "$($env:VCToolsInstallDir)/../Llvm/x64".Replace('\', '/')
              $winVcPath = "$($env:VCToolsInstallDir)/..".Replace('\', '/')
              $winSdkPath = "$($env:WindowsSDKDir)".Replace('\', '/')
              $winSdkVersion = $env:WindowsSDKVersion
          
              $platformArgs = "target_os = `"win`"`n" +
                              "target_cpu = `"x64`"`n" +
                              "cc = `"clang`"`n" +
                              "cxx = `"clang++`"`n" +
                              "clang_win = `"$clangWinPath`"`n" +
                              "win_vc = `"$winVcPath`"`n" +
                              "win_sdk = `"$winSdkPath`"`n" +
                              "win_sdk_version = `"$winSdkVersion`"`n" +
                              "extra_cflags_c = [ `"/MD`" ]`n" +
                              "extra_cflags_cc += [ `"/MD`" ]`n" +
                              "extra_ldflags = [ `"/OPT:ICF`", `"/OPT:REF`" ]`n" +
                              "dawn_enable_d3d11 = true`n" +
                              "dawn_enable_d3d12 = true`n" +
                              "dawn_enable_vulkan = true`n"
          } elseif ($env:TARGET -eq 'Linux') {
              $platformArgs = "target_os = `"linux`"`n" +
                              "target_cpu = `"x64`"`n" +
                              "cc = `"clang`"`n" +
                              "cxx = `"clang++`"`n" +
                              "extra_cflags_cc += [ `"-fno-exceptions`" ]`n" +
                              "dawn_enable_vulkan = true`n" +
                              "dawn_enable_opengles = true`n"
          } elseif ($env:TARGET -eq 'Android') {
              $ndkPathForGn = $env:NDK_PATH.Replace('\', '/')
              $platformArgs = "target_os = `"android`"`n" +
                              "target_cpu = `"$($env:ARCH)`"`n" +
                              "ndk = `"$ndkPathForGn`"`n" +
                              "ndk_api = 21`n" +
                              "extra_cflags_cc += [ `"-fno-exceptions`" ]`n" +
                              "dawn_enable_vulkan = true`n" +
                              "dawn_enable_opengles = true`n"
          }
          
          $finalArgs = $baseArgs + $platformArgs
          
          # --- 写入 args.gn 文件 ---
          $buildDir = "skia/out/$($env:OUTPUT_DIR_NAME)"
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          $argsFile = Join-Path $buildDir "args.gn"
          Set-Content -Path $argsFile -Value $finalArgs
          
          Write-Host "--- 最终 args.gn 内容 ---"
          Get-Content $argsFile
          Write-Host "---------------------------"
          
          & gn gen $buildDir

      - name: 2.4 编译 Skia (ninja)
        run: ninja -C skia/out/${{ matrix.output_dir_name }} -j${{ steps.ninja-jobs.outputs.count }}

      # ==================================================================
      #   步骤 3: 打包为 SDK 并上传
      # ==================================================================
      - name: 3.1 打包 SDK (头文件, 库, CMake配置)
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          OUTPUT_DIR_NAME: ${{ matrix.output_dir_name }}
        shell: pwsh
        run: |
          $SourceDir = (Get-Location).Path
          $SkiaRoot = Join-Path $SourceDir "skia"
          $BuildOutputDir = Join-Path $SkiaRoot "out/$($env:OUTPUT_DIR_NAME)"
          $DestinationDir = Join-Path $SourceDir "skia-sdk"

          if (Test-Path $DestinationDir) { Remove-Item -Recurse -Force $DestinationDir }
          $SDKIncludeDir = Join-Path $DestinationDir "include"
          $SDKLibDir = Join-Path $DestinationDir "lib"
          $SDKBinDir = Join-Path $DestinationDir "bin"
          $SDKLicenseDir = Join-Path $DestinationDir "LICENSES"
          New-Item -ItemType Directory -Path $SDKIncludeDir, $SDKLibDir, $SDKBinDir, $SDKLicenseDir | Out-Null

          # --- 1. 拷贝文件 (逻辑不变) ---
          Write-Host "正在拷贝头文件..."
          Copy-Item -Path (Join-Path $SkiaRoot "include") -Destination $SDKIncludeDir -Recurse -Force
          Copy-Item -Path (Join-Path $SkiaRoot "modules") -Destination $SDKIncludeDir -Recurse -Force
          $dawnIncludeSource = Join-Path $SkiaRoot "third_party/externals/dawn/include"
          if (Test-Path $dawnIncludeSource) { Copy-Item -Path $dawnIncludeSource -Destination (Join-Path $SDKIncludeDir "third_party/externals/dawn") -Recurse -Force }
          $genDawnInclude = Join-Path $BuildOutputDir "gen/third_party/externals/dawn/include"
          if (Test-Path $genDawnInclude) {
              $destParent = "gen/third_party/externals/dawn"
              New-Item -ItemType Directory -Path (Join-Path $SDKIncludeDir $destParent) -Force | Out-Null
              Copy-Item -Path $genDawnInclude -Destination (Join-Path $SDKIncludeDir $destParent) -Recurse -Force
          }
          Write-Host "正在拷贝库文件和二进制文件..."
          if ($env:TARGET -eq "Windows") {
              Get-ChildItem -Path $BuildOutputDir -Filter "*.lib" | Copy-Item -Destination $SDKLibDir
              Get-ChildItem -Path $BuildOutputDir -Filter "*.dll" | Copy-Item -Destination $SDKBinDir
          } else {
              Get-ChildItem -Path $BuildOutputDir -Filter "*.a" | Copy-Item -Destination $SDKLibDir
              Get-ChildItem -Path $BuildOutputDir -Filter "*.so" | Copy-Item -Destination $SDKBinDir
          }
          if (Test-Path (Join-Path $BuildOutputDir "icudtl.dat")) { Copy-Item -Path (Join-Path $BuildOutputDir "icudtl.dat") -Destination $SDKBinDir -Force }
          Write-Host "正在拷贝许可证文件..."
          Get-ChildItem -Path $SkiaRoot -Recurse -Include "LICENSE*", "COPYING*" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination (Join-Path $SDKLicenseDir "$($_.Directory.Name)-$($_.Name)") -Force
          }

          # --- 2. 生成 SkiaConfig.cmake (使用字符串拼接) ---
          Write-Host "正在生成 SkiaConfig.cmake..."
          $CmakeConfigFile = Join-Path $DestinationDir "SkiaConfig.cmake"
          $CmakeContent = ""
          switch ($env:TARGET) {
              'Windows' {
                  $CmakeContent = "# Skia SDK CMake配置文件 (为Windows生成)`n" +
                                  "get_filename_component(Skia_SELF_DIR `"${CMAKE_CURRENT_LIST_FILE}`" DIRECTORY)`n" +
                                  "set(Skia_INCLUDE_DIR `"${Skia_SELF_DIR}/include`")`n" +
                                  "set(Skia_LIBRARY_DIR `"${Skia_SELF_DIR}/lib`")`n" +
                                  "if (NOT TARGET Skia::Skia)`n" +
                                  "    add_library(Skia::Skia INTERFACE IMPORTED)`n" +
                                  "    target_include_directories(Skia::Skia INTERFACE`n" +
                                  "        `"${Skia_INCLUDE_DIR}`"`n" +
                                  "        `"${Skia_INCLUDE_DIR}/modules`"`n" +
                                  "        `"${Skia_INCLUDE_DIR}/third_party/externals/dawn/include`"`n" +
                                  "        `"${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include`"`n" +
                                  "    )`n" +
                                  "    target_link_libraries(Skia::Skia INTERFACE`n" +
                                  '        "${Skia_LIBRARY_DIR}/skia.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/pathkit.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/skresources.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/skottie.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/svg.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/freetype2.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/harfbuzz.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/zlib.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/dawn_native.dll.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/dawn_proc.dll.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/dawn_platform.dll.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/allocator_core.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/allocator_base.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/allocator_shim.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/raw_ptr.lib"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/common.lib"' + "`n" +
                                  "        d3d11.lib d3d12.lib dxguid.lib onecore.lib`n" +
                                  "    )`n" +
                                  "    target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES SK_BUILD_FOR_WIN)`n" +
                                  "endif()`n"
              }
              'Linux' {
                  $CmakeContent = "# Skia SDK CMake配置文件 (为Linux生成)`n" +
                                  "get_filename_component(Skia_SELF_DIR `"${CMAKE_CURRENT_LIST_FILE}`" DIRECTORY)`n" +
                                  "set(Skia_INCLUDE_DIR `"${Skia_SELF_DIR}/include`")`n" +
                                  "set(Skia_LIBRARY_DIR `"${Skia_SELF_DIR}/lib`")`n" +
                                  "if (NOT TARGET Skia::Skia)`n" +
                                  "    add_library(Skia::Skia INTERFACE IMPORTED)`n" +
                                  "    target_include_directories(Skia::Skia INTERFACE`n" +
                                  "            `"${Skia_INCLUDE_DIR}`"`n" +
                                  "            `"${Skia_INCLUDE_DIR}/modules`"`n" +
                                  "            `"${Skia_INCLUDE_DIR}/third_party/externals/dawn/include`"`n" +
                                  "            `"${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include`"`n" +
                                  "    )`n" +
                                  "    target_link_libraries(Skia::Skia INTERFACE`n" +
                                  '            "-Wl,--start-group"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libskia.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libpathkit.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libskresources.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libskottie.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libsvg.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libfreetype2.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libharfbuzz.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libzlib.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libdawn_native_static.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libdawn_proc_static.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libdawn_platform_static.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/liballocator_core.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/liballocator_base.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/liballocator_shim.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libraw_ptr.a"' + "`n" +
                                  '            "${Skia_LIBRARY_DIR}/libcommon.a"' + "`n" +
                                  '            "-Wl,--end-group"' + "`n" +
                                  "            fontconfig`n" +
                                  "            dl`n" +
                                  "            pthread`n" +
                                  "            EGL`n" +
                                  "            GLESv2`n" +
                                  "    )`n" +
                                  "    target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES)`n" +
                                  "endif()`n"
              }
              'Android' {
                  $CmakeContent = "# Skia SDK CMake配置文件 (为Android生成)`n" +
                                  "get_filename_component(Skia_SELF_DIR `"${CMAKE_CURRENT_LIST_FILE}`" DIRECTORY)`n" +
                                  "set(Skia_INCLUDE_DIR `"${Skia_SELF_DIR}/include`")`n" +
                                  "set(Skia_LIBRARY_DIR `"${Skia_SELF_DIR}/lib`")`n" +
                                  "if (NOT TARGET Skia::Skia)`n" +
                                  "    add_library(Skia::Skia INTERFACE IMPORTED)`n" +
                                  "    target_include_directories(Skia::Skia INTERFACE`n" +
                                  "        `"${Skia_INCLUDE_DIR}`"`n" +
                                  "        `"${Skia_INCLUDE_DIR}/modules`"`n" +
                                  "        `"${Skia_INCLUDE_DIR}/third_party/externals/dawn/include`"`n" +
                                  "        `"${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn/include`"`n" +
                                  "    )`n" +
                                  "    target_link_libraries(Skia::Skia INTERFACE`n" +
                                  '        "-Wl,--start-group"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libskia.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libpathkit.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libskresources.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libskottie.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libsvg.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libfreetype2.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libharfbuzz.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libzlib.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libdawn_native_static.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libdawn_proc_static.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libdawn_platform_static.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/liballocator_core.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/liballocator_base.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/liballocator_shim.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libraw_ptr.a"' + "`n" +
                                  '        "${Skia_LIBRARY_DIR}/libcommon.a"' + "`n" +
                                  '        "-Wl,--end-group"' + "`n" +
                                  "        log`n" +
                                  "        android`n" +
                                  "        EGL`n" +
                                  "        GLESv2`n" +
                                  "    )`n" +
                                  "    target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES)`n" +
                                  "endif()`n"
              }
          }
          Set-Content -Path $CmakeConfigFile -Value $CmakeContent
          
          Write-Host "✅ SDK for $($env:TARGET)-$($env:ARCH) 已成功打包到 $DestinationDir"


      - name: 3.2 上传 SDK 构件
        uses: actions/upload-artifact@v4
        with:
          name: skia-sdk-${{ matrix.name }}
          path: skia-sdk/
