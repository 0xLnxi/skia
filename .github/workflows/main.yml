name: Build Skia SDK (Precise Packaging)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    name: Build for ${{ matrix.target_os }}-${{ matrix.target_cpu }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: "win"
            target_cpu: "x64"
            artifact_name: "skia-win-rel-x64-sdk"
          - os: ubuntu-latest
            target_os: "linux"
            target_cpu: "x64"
            artifact_name: "skia-linux-rel-x64-sdk"
          - os: ubuntu-latest
            target_os: "android"
            target_cpu: "arm64"
            artifact_name: "skia-android-rel-arm64-sdk"
            android_api: 21

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git g++ clang ninja-build zip unzip \
            libfontconfig-dev libgl1-mesa-dev libvulkan-dev libx11-xcb-dev
          if [ "${{ matrix.target_os }}" = "android" ]; then
            sudo apt-get install -y openjdk-11-jdk
          fi
        shell: bash

      - name: Set up Android NDK (if building for Android)
        if: matrix.target_os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone Official Skia Repository and Depot Tools
        run: |
          git clone https://skia.googlesource.com/skia.git
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
        shell: bash

      - name: Set up depot_tools (Initialize)
        run: gclient
        shell: bash

      - name: Sync Skia dependencies
        working-directory: ./skia
        run: python3 tools/git-sync-deps

      - name: Configure Skia build with GN
        working-directory: ./skia
        run: |
          mkdir -p out/Release
          {
            echo "is_official_build = true"
            echo "is_debug = false"
            echo "skia_use_freetype = true"
            echo "skia_use_harfbuzz = true"
            echo "skia_pdf_subset_harfbuzz = true"
            echo "skia_enable_skottie = true"
            echo "skia_enable_svg = true"
            echo "skia_use_system_expat = false"
            echo "skia_use_system_icu = false"
            echo "skia_use_system_libjpeg_turbo = false"
            echo "skia_use_system_libpng = false"
            echo "skia_use_system_libwebp = false"
            echo "skia_use_system_zlib = false"
            echo "skia_use_system_freetype2 = false"
            echo "skia_use_system_harfbuzz = false"
            echo "target_os = \"${{ matrix.target_os }}\""
            echo "target_cpu = \"${{ matrix.target_cpu }}\""
          } > out/Release/args.gn
          if [ "${{ matrix.target_os }}" = "win" ]; then
            {
              echo ""
              echo "skia_enable_ganesh = false"
              echo "skia_enable_graphite = true"
              echo "skia_use_dawn = true"
              echo "dawn_enable_d3d11 = true"
              echo "dawn_enable_d3d12 = true"
              echo "dawn_enable_vulkan = true"
              echo 'extra_cflags_c = [ "/MT" ]'
              echo 'extra_cflags_cc = [ "/MT", "/std:c++20" ]'
              echo "cc = \"clang\""
              echo "cxx = \"clang++\""
              echo 'clang_win = "C:/Program Files/LLVM"'
            } >> out/Release/args.gn
          elif [ "${{ matrix.target_os }}" = "linux" ]; then
            {
              echo ""
              echo "skia_enable_ganesh = false"
              echo "skia_enable_graphite = true"
              echo "skia_use_dawn = true"
              echo "dawn_enable_opengles = true"
              echo "dawn_enable_vulkan = true"
              echo "dawn_enable_x11 = true"
              echo 'extra_cflags_cc = [ "-std=c++20" ]'
            } >> out/Release/args.gn
          elif [ "${{ matrix.target_os }}" = "android" ]; then
            {
              echo ""
              echo "skia_enable_ganesh = false"
              echo "skia_enable_graphite = true"
              echo "skia_use_dawn = true"
              echo "dawn_enable_opengles = true"
              echo "dawn_enable_vulkan = true"
              echo "skia_use_icu = true"
              echo "skia_enable_skshaper = true"
              echo "skia_enable_fontmgr_android = true"
              echo "skia_use_dng_sdk = false"
              echo "skia_use_piex = false"
              echo "android_api_level = ${{ matrix.android_api }}"
              echo "ndk = \"$ANDROID_NDK_ROOT\""
              echo 'extra_cflags_cc = [ "-std=c++20" ]'
            } >> out/Release/args.gn
          fi
          echo "--- Content of args.gn ---"
          cat out/Release/args.gn
          echo "--------------------------"
          gn gen out/Release
        shell: bash

      - name: Compile Skia with Ninja
        working-directory: ./skia
        run: ninja -C out/Release -j 4 skia modules

      - name: Package SDK according to original script
        working-directory: ./skia
        shell: bash
        run: |
          SDK_DIR="../skia-sdk"
          BUILD_DIR="./out/Release"

          echo "--- Starting SDK Packaging ---"
          
          # 1. 清理并创建目录结构
          if [ -d "$SDK_DIR" ]; then
            echo "Cleaning old SDK directory..."
            rm -rf "$SDK_DIR"
          fi
          echo "Creating SDK directory structure..."
          mkdir -p "$SDK_DIR/include" "$SDK_DIR/lib" "$SDK_DIR/bin" "$SDK_DIR/LICENSES"

          # 2. 收录头文件 (完全复刻原始逻辑)
          echo "Copying header files..."
          cp -r include/ "$SDK_DIR/"
          cp -r modules/ "$SDK_DIR/include/"
          if [ -d "third_party/externals/dawn/include" ]; then
            mkdir -p "$SDK_DIR/include/third_party/externals/dawn"
            cp -r third_party/externals/dawn/include/* "$SDK_DIR/include/third_party/externals/dawn/"
          fi
          if [ -d "$BUILD_DIR/gen/third_party/externals/dawn/include" ]; then
            mkdir -p "$SDK_DIR/include/gen/third_party/externals/dawn"
            cp -r "$BUILD_DIR/gen/third_party/externals/dawn/include/"* "$SDK_DIR/include/gen/third_party/externals/dawn/"
          fi
          echo "Header files copied."

          # 3. 收录库文件和二进制文件 (平台自适应)
          echo "Copying library and binary files..."
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BUILD_DIR"/*.lib "$SDK_DIR/lib/" 2>/dev/null || true
            cp "$BUILD_DIR"/*.dll "$SDK_DIR/bin/" 2>/dev/null || true
          else # Linux and Android
            cp "$BUILD_DIR"/*.a "$SDK_DIR/lib/" 2>/dev/null || true
            cp "$BUILD_DIR"/*.so "$SDK_DIR/bin/" 2>/dev/null || true
          fi
          cp "$BUILD_DIR"/icudtl.dat "$SDK_DIR/bin/" 2>/dev/null || true
          echo "Library and binary files copied."

          # 4. 收录许可证文件 (完全复刻原始逻辑)
          echo "Copying license files..."
          # 查找深度为4以包含如 third_party/externals/icu 之类的目录
          find . -maxdepth 4 -type f \( -name "LICENSE*" -o -name "COPYING*" \) -exec bash -c 'cp "$1" "'$SDK_DIR'/LICENSES/$(basename $(dirname "$1"))-$(basename "$1")"' _ {} \;
          echo "License files copied."

          # 5. 生成跨平台的 CMake 配置文件
          echo "Generating cross-platform SkiaConfig.cmake..."
          # 使用 'EOF' 以防止 shell 扩展 ${...} 变量
          cat > "$SDK_DIR/SkiaConfig.cmake" << 'EOF'
# Skia SDK CMake config file
# This file is automatically generated.

# Get the directory where this config file is located.
get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)

set(Skia_INCLUDE_DIR "${Skia_SELF_DIR}/include")
set(Skia_LIBRARY_DIR "${Skia_SELF_DIR}/lib")
set(Skia_BINARY_DIR "${Skia_SELF_DIR}/bin")

if (NOT TARGET Skia::Skia)
    add_library(Skia::Skia INTERFACE IMPORTED)

    # --- Set include directories ---
    target_include_directories(Skia::Skia INTERFACE
            "${Skia_INCLUDE_DIR}"
            "${Skia_INCLUDE_DIR}/third_party/externals/dawn"
            "${Skia_INCLUDE_DIR}/gen/third_party/externals/dawn"
    )

    # --- Platform-specific link libraries ---
    if(WIN32)
        message(STATUS "Configuring Skia for Windows")
        target_compile_definitions(Skia::Skia INTERFACE _USE_MATH_DEFINES SK_BUILD_FOR_WIN)
        target_link_libraries(Skia::Skia INTERFACE
                # Skia & Dawn Core libs
                "${Skia_LIBRARY_DIR}/skia.lib"
                "${Skia_LIBRARY_DIR}/skcms.lib"
                "${Skia_LIBRARY_DIR}/skshaper.lib"
                "${Skia_LIBRARY_DIR}/skunicode.lib"
                "${Skia_LIBRARY_DIR}/dawn_native.dll.lib"
                "${Skia_LIBRARY_DIR}/dawn_proc.dll.lib"
                "${Skia_LIBRARY_DIR}/dawn_platform.dll.lib"
                # Dependencies
                "${Skia_LIBRARY_DIR}/freetype.lib"
                "${Skia_LIBRARY_DIR}/harfbuzz.lib"
                "${Skia_LIBRARY_DIR}/icu.lib"
                "${Skia_LIBRARY_DIR}/zlib.lib"
                # Windows System Libraries
                d3d11.lib d3d12.lib dxgi.lib dxguid.lib opengl32.lib
        )
    elseif(ANDROID)
        message(STATUS "Configuring Skia for Android")
        target_compile_definitions(Skia::Skia INTERFACE SK_BUILD_FOR_ANDROID)
        target_link_libraries(Skia::Skia INTERFACE
                # Order is important on static builds
                "${Skia_LIBRARY_DIR}/libskia.a"
                "${Skia_LIBRARY_DIR}/libskshaper.a"
                "${Skia_LIBRARY_DIR}/libskunicode.a"
                "${Skia_LIBRARY_DIR}/libskcms.a"
                "${Skia_LIBRARY_DIR}/libdawn_native.a"
                "${Skia_LIBRARY_DIR}/libdawn_proc.a"
                "${Skia_LIBRARY_DIR}/libdawn_platform.a"
                "${Skia_LIBRARY_DIR}/libfreetype.a"
                "${Skia_LIBRARY_DIR}/libharfbuzz.a"
                "${Skia_LIBRARY_DIR}/libicu.a"
                "${Skia_LIBRARY_DIR}/libz.a"
                # Android System Libraries
                android log EGL GLESv2 vulkan
        )
    elseif(UNIX)
        message(STATUS "Configuring Skia for Linux")
        target_compile_definitions(Skia::Skia INTERFACE SK_BUILD_FOR_UNIX)
        target_link_libraries(Skia::Skia INTERFACE
                # Order is important on static builds
                "${Skia_LIBRARY_DIR}/libskia.a"
                "${Skia_LIBRARY_DIR}/libskshaper.a"
                "${Skia_LIBRARY_DIR}/libskunicode.a"
                "${Skia_LIBRARY_DIR}/libskcms.a"
                "${Skia_LIBRARY_DIR}/libdawn_native.a"
                "${Skia_LIBRARY_DIR}/libdawn_proc.a"
                "${Skia_LIBRARY_DIR}/libdawn_platform.a"
                "${Skia_LIBRARY_DIR}/libfreetype.a"
                "${Skia_LIBRARY_DIR}/libharfbuzz.a"
                "${Skia_LIBRARY_DIR}/libicu.a"
                "${Skia_LIBRARY_DIR}/libz.a"
                # Linux System Libraries
                fontconfig freetype GL vulkan X11 X11-xcb pthread dl
        )
    endif()
endif()
EOF
          echo "CMake config file generated."

      - name: Create ZIP archive
        run: 7z a -tzip "${{ matrix.artifact_name }}.zip" ./skia-sdk/*
        shell: bash

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
