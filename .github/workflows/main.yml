# GitHub Workflow for building the Skia Graphics Library
#
# .SYNOPSIS
#   为Windows、Linux或Android目标构建Skia库。
#
# .DESCRIPTION
#   此工作流自动化了从源码构建Skia图形库的过程。
#   它被设计为在包含'skia' git子模块的仓库中运行。
#
# .TRIGGERS
#   1. Weekly Schedule: 每周一 08:00 UTC 自动运行，构建所有通用平台。
#   2. Manual Dispatch: 可以手动触发，并选择一个特定的平台进行构建。
#
# .USAGE
#   - 对于自动构建，无需任何操作。
#   - 对于手动构建:
#     1. 导航到仓库的 "Actions" 탭。
#     2. 在左侧选择 "Build Skia SDK" 工作流。
#     3. 点击 "Run workflow" 按钮。
#     4. 从下拉菜单中选择一个构建目标，然后开始运行。
#     5. 运行结束后，从工作流摘要页面下载包含SDK的构建产物。

name: Build Skia SDK

on:
  # 1. 每周定时触发
  schedule:
    # UTC时间每周一上午8点运行 (Cron syntax)
    - cron: '0 8 * * 1'

  # 2. 手动触发
  workflow_dispatch:
    inputs:
      build_target:
        description: '选择要构建的通用平台 (Select common build target)'
        required: true
        type: choice
        default: 'windows-x64'
        options:
          - windows-x64
          - linux-x64
          - android-arm64

jobs:
  # ==================================================================
  # Job: Windows (x64) Build
  # ==================================================================
  build-windows:
    name: Build for Windows x64
    # 条件：当为定时任务时运行，或者手动触发并选择了此目标时运行
    if: github.event_name == 'schedule' || github.event.inputs.build_target == 'windows-x64'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: ${{ runner.os }}-depot-tools

      - name: Install depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - name: Add depot_tools to PATH
        run: echo "$GITHUB_WORKSPACE/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Skia Dependencies
        id: cache-skia-deps
        uses: actions/cache@v4
        with:
          path: skia/third_party
          key: ${{ runner.os }}-skia-deps-${{ hashFiles('skia/DEPS') }}

      - name: Install LLVM/Clang
        run: choco install llvm --version=18.1.3 -y

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Synchronize Skia Dependencies
        working-directory: skia
        run: python3 tools/git-sync-deps

      - name: Generate GN Build Configuration
        working-directory: skia
        run: |
          $OutputDirName = "Release-Clang-Optimized-Win"
          $BuildDir = "out/$OutputDirName"
          if (-not (Test-Path $BuildDir)) {
            New-Item -ItemType Directory -Path $BuildDir | Out-Null
          }
          $LlvmPath = "C:/Program Files/LLVM"
          $GnArgs = @"
          is_official_build = true
          is_debug = false
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_enable_graphite = true
          skia_use_dawn = true
          dawn_enable_d3d11 = true
          dawn_enable_d3d12 = true
          dawn_enable_vulkan = true
          skia_use_system_expat = false
          skia_use_system_icu = false
          skia_use_system_libjpeg_turbo = false
          skia_use_system_libpng = false
          skia_use_system_libwebp = false
          skia_use_system_zlib = false
          target_os = "win"
          target_cpu = "x64"
          cc = "clang"
          cxx = "clang++"
          clang_win = "$($LlvmPath -replace '\\', '/')/"
          extra_cflags_c = [ "/MD" ]
          extra_cflags_cc = [ "/MD", "-D_USE_MATH_DEFINES", "/std:c++20" ]
          extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]
          "@
          Set-Content -Path (Join-Path $BuildDir "args.gn") -Value $GnArgs
          gn gen $BuildDir

      - name: Compile Skia with Ninja
        working-directory: skia
        run: ninja -C "out/Release-Clang-Optimized-Win"

      - name: Package SDK
        id: package-sdk
        run: |
          $SourceDir = "${{ github.workspace }}/skia"
          $BuildOutputDir = Join-Path $SourceDir "out/Release-Clang-Optimized-Win"
          $DestinationDir = "${{ github.workspace }}/skia-windows-x64"
          New-Item -ItemType Directory -Path "$DestinationDir/include", "$DestinationDir/lib", "$DestinationDir/bin", "$DestinationDir/LICENSES"
          robocopy "$SourceDir/include" "$DestinationDir/include/include" /E /NP /NFL /NDL
          robocopy "$SourceDir/modules" "$DestinationDir/include/modules" /E /NP /NFL /NDL
          robocopy "$SourceDir/third_party/externals/dawn/include" "$DestinationDir/include/third_party/externals/dawn/include" /E /NP /NFL /NDL
          robocopy "$BuildOutputDir/gen/third_party/externals/dawn/include" "$DestinationDir/include/gen/third_party/externals/dawn/include" /E /NP /NFL /NDL
          Get-ChildItem -Path $BuildOutputDir -Filter "*.lib" | Copy-Item -Destination "$DestinationDir/lib"
          Get-ChildItem -Path $BuildOutputDir -Filter "*.dll" | Copy-Item -Destination "$DestinationDir/bin"
          Copy-Item -Path (Join-Path $BuildOutputDir "icudtl.dat") -Destination "$DestinationDir/bin" -ErrorAction SilentlyContinue
          Copy-Item -Path (Join-Path $SourceDir "LICENSE") -Destination (Join-Path $DestinationDir "LICENSES" "Skia-LICENSE")
          echo "sdk_path=$DestinationDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Skia SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-windows-x64
          path: ${{ steps.package-sdk.outputs.sdk_path }}

  # ==================================================================
  # Job: Linux (x64) Build
  # ==================================================================
  build-linux:
    name: Build for Linux x64
    if: github.event_name == 'schedule' || github.event.inputs.build_target == 'linux-x64'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: ${{ runner.os }}-depot-tools

      - name: Install depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      
      - name: Add depot_tools to PATH
        run: echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Cache Skia Dependencies
        id: cache-skia-deps
        uses: actions/cache@v4
        with:
          path: skia/third_party
          key: ${{ runner.os }}-skia-deps-${{ hashFiles('skia/DEPS') }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev libxrandr-dev libx11-xcb-dev libxcb-dri3-dev libxrender-dev libxshmfence-dev python3-requests

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Synchronize Skia Dependencies
        working-directory: skia
        run: python3 tools/git-sync-deps

      - name: Generate GN Build Configuration
        working-directory: skia
        run: |
          OUTPUT_DIR="out/Release-Clang-Optimized-Linux"
          mkdir -p $OUTPUT_DIR
          cat <<EOF > $OUTPUT_DIR/args.gn
          is_official_build = true
          is_debug = false
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_enable_graphite = true
          skia_use_dawn = true
          dawn_enable_vulkan = true
          dawn_enable_opengles = true
          dawn_use_x11 = true
          skia_use_system_expat = false
          skia_use_system_icu = false
          skia_use_system_libjpeg_turbo = false
          skia_use_system_libpng = false
          skia_use_system_libwebp = false
          skia_use_system_zlib = false
          target_os = "linux"
          target_cpu = "x64"
          cc = "clang"
          cxx = "clang++"
          extra_cflags_cc = [ "-std=c++20", "-D_USE_MATH_DEFINES", "-fno-exceptions" ]
          EOF
          gn gen $OUTPUT_DIR

      - name: Compile Skia with Ninja
        working-directory: skia
        run: ninja -C "out/Release-Clang-Optimized-Linux"

      - name: Package SDK
        id: package-sdk
        run: |
          SOURCE_DIR="${{ github.workspace }}/skia"
          BUILD_OUTPUT_DIR="$SOURCE_DIR/out/Release-Clang-Optimized-Linux"
          DESTINATION_DIR="${{ github.workspace }}/skia-linux-x64"
          mkdir -p "$DESTINATION_DIR/include" "$DESTINATION_DIR/lib" "$DESTINATION_DIR/bin" "$DESTINATION_DIR/LICENSES"
          cp -r "$SOURCE_DIR/include" "$DESTINATION_DIR/include/include"
          cp -r "$SOURCE_DIR/modules" "$DESTINATION_DIR/include/modules"
          cp -r "$SOURCE_DIR/third_party/externals/dawn/include" "$DESTINATION_DIR/include/third_party/externals/dawn/include"
          cp -r "$BUILD_OUTPUT_DIR/gen/third_party/externals/dawn/include" "$DESTINATION_DIR/include/gen/third_party/externals/dawn/include"
          find "$BUILD_OUTPUT_DIR" -maxdepth 1 -name "*.a" -exec cp {} "$DESTINATION_DIR/lib" \;
          find "$BUILD_OUTPUT_DIR" -maxdepth 1 -name "*.so" -exec cp {} "$DESTINATION_DIR/bin" \;
          if [ -f "$BUILD_OUTPUT_DIR/icudtl.dat" ]; then cp "$BUILD_OUTPUT_DIR/icudtl.dat" "$DESTINATION_DIR/bin"; fi
          cp "$SOURCE_DIR/LICENSE" "$DESTINATION_DIR/LICENSES/Skia-LICENSE"
          echo "sdk_path=$DESTINATION_DIR" >> $GITHUB_OUTPUT
      
      - name: Upload Skia SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-linux-x64
          path: ${{ steps.package-sdk.outputs.sdk_path }}

  # ==================================================================
  # Job: Android (arm64) Build
  # ==================================================================
  build-android:
    name: Build for Android arm64
    if: github.event_name == 'schedule' || github.event.inputs.build_target == 'android-arm64'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: ${{ runner.os }}-depot-tools

      - name: Install depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      
      - name: Add depot_tools to PATH
        run: echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Cache Skia Dependencies
        id: cache-skia-deps
        uses: actions/cache@v4
        with:
          path: skia/third_party
          key: ${{ runner.os }}-android-skia-deps-${{ hashFiles('skia/DEPS') }}
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          
      - name: Set up Android NDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: 'r25c'

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Synchronize Skia Dependencies
        working-directory: skia
        run: python3 tools/git-sync-deps

      - name: Generate GN Build Configuration
        working-directory: skia
        run: |
          OUTPUT_DIR="out/Release-Clang-Optimized-Android"
          mkdir -p $OUTPUT_DIR
          cat <<EOF > $OUTPUT_DIR/args.gn
          is_official_build = true
          is_debug = false
          skia_use_freetype = true
          skia_use_harfbuzz = true
          skia_enable_skottie = true
          skia_enable_svg = true
          skia_enable_ganesh = true
          skia_enable_graphite = true
          skia_use_dawn = true
          dawn_enable_vulkan = true
          dawn_enable_opengles = true
          skia_use_system_expat = false
          skia_use_system_icu = false
          skia_use_system_libjpeg_turbo = false
          skia_use_system_libpng = false
          skia_use_system_libwebp = false
          skia_use_system_zlib = false
          target_os = "android"
          target_cpu = "arm64"
          ndk = "${ANDROID_NDK_LATEST_PATH}"
          ndk_api = 21
          extra_cflags_cc = [ "-std=c++20", "-D_USE_MATH_DEFINES", "-fno-exceptions" ]
          EOF
          gn gen $OUTPUT_DIR

      - name: Compile Skia with Ninja
        working-directory: skia
        run: ninja -C "out/Release-Clang-Optimized-Android"
        
      - name: Package SDK
        id: package-sdk
        run: |
          SOURCE_DIR="${{ github.workspace }}/skia"
          BUILD_OUTPUT_DIR="$SOURCE_DIR/out/Release-Clang-Optimized-Android"
          DESTINATION_DIR="${{ github.workspace }}/skia-android-arm64"
          mkdir -p "$DESTINATION_DIR/include" "$DESTINATION_DIR/lib" "$DESTINATION_DIR/bin" "$DESTINATION_DIR/LICENSES"
          cp -r "$SOURCE_DIR/include" "$DESTINATION_DIR/include/include"
          cp -r "$SOURCE_DIR/modules" "$DESTINATION_DIR/include/modules"
          cp -r "$SOURCE_DIR/third_party/externals/dawn/include" "$DESTINATION_DIR/include/third_party/externals/dawn/include"
          cp -r "$BUILD_OUTPUT_DIR/gen/third_party/externals/dawn/include" "$DESTINATION_DIR/include/gen/third_party/externals/dawn/include"
          find "$BUILD_OUTPUT_DIR" -maxdepth 1 -name "*.a" -exec cp {} "$DESTINATION_DIR/lib" \;
          find "$BUILD_OUTPUT_DIR" -maxdepth 1 -name "*.so" -exec cp {} "$DESTINATION_DIR/bin" \;
          if [ -f "$BUILD_OUTPUT_DIR/icudtl.dat" ]; then cp "$BUILD_OUTPUT_DIR/icudtl.dat" "$DESTINATION_DIR/bin"; fi
          cp "$SOURCE_DIR/LICENSE" "$DESTINATION_DIR/LICENSES/Skia-LICENSE"
          echo "sdk_path=$DESTINATION_DIR" >> $GITHUB_OUTPUT
      
      - name: Upload Skia SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-android-arm64
          path: ${{ steps.package-sdk.outputs.sdk_path }}
