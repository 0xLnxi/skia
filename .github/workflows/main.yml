# .github/workflows/build-skia-sdk.yml

name: Build Skia SDK Weekly

on:
  # 允许手动从 GitHub Actions 页面触发此工作流
  workflow_dispatch:
  # 每周日凌晨 3:15 (UTC) 自动触发
  schedule:
    - cron: '15 3 * * 0'

jobs:
  build_skia:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target_os: win
            target_cpu: x64
            output_dir_name: Release-Clang-Optimized-Win
            # 使用 YAML 字面量块 `|` 定义多行文本，以确保格式正确
            gn_args: |
              is_official_build = true
              is_debug = false
              target_os = "win"
              target_cpu = "x64"
              cc = "clang"
              cxx = "clang++"
              clang_win = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64"
              win_vc = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC"
              win_sdk = "C:/Program Files (x86)/Windows Kits/10"
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_d3d11 = true
              dawn_enable_d3d12 = true
              dawn_enable_vulkan = true
              extra_cflags_c = [ "/MT" ]
              extra_cflags_cc = [ "/MT", "/std:c++20" ]
              extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]

          - name: linux-x64
            runner: ubuntu-latest
            target_os: linux
            target_cpu: x64
            output_dir_name: Release-Clang-Optimized-Linux
            gn_args: |
              is_official_build = true
              is_debug = false
              target_os = "linux"
              target_cpu = "x64"
              cc = "clang"
              cxx = "clang++"
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_vulkan = true
              dawn_enable_opengles = true
              dawn_use_x11 = true
              extra_cflags_cc = [ "-std=c++20", "-fno-exceptions" ]
              
          - name: android-arm64
            runner: ubuntu-latest
            target_os: android
            target_cpu: arm64
            output_dir_name: Release-Clang-Optimized-Android
            gn_args: |
              is_official_build = true
              is_debug = false
              target_os = "android"
              target_cpu = "arm64"
              ndk = "/usr/local/lib/android/sdk/ndk"
              ndk_api = 21
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_vulkan = true
              dawn_enable_opengles = true
              extra_cflags_cc = [ "-std=c++20", "-fno-exceptions", "-D_LIBCPP_HAS_NO_THREADS" ]

    steps:
    # ==================================================================
    #   步骤 1: 准备环境 (Checkout, Dependencies, Tools)
    # ==================================================================
    - name: 1.1 Checkout Skia Source Code (This Repo)
      uses: actions/checkout@v4

    - name: 1.2 Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang python3-requests libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev libxrandr-dev libx11-xcb-dev libxcb-dri3-dev libxrender-dev libxshmfence-dev

    - name: 1.3 Setup depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$(pwd)/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      shell: pwsh

    - name: 1.4 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # ==================================================================
    #   步骤 2: 同步依赖项并编译
    # ==================================================================
    - name: 2.1 Sync Skia Dependencies (DEPS)
      run: python3 tools/git-sync-deps

    - name: 2.2 Configure Skia Build (gn)
      run: |
        # 创建 args.gn 文件，内容来自矩阵变量
        echo "${{ matrix.gn_args }}" > out/${{ matrix.output_dir_name }}/args.gn
        gn gen out/${{ matrix.output_dir_name }}
      shell: bash

    - name: 2.3 Compile Skia (ninja)
      run: ninja -C out/${{ matrix.output_dir_name }}

    # ==================================================================
    #   步骤 3: 打包为 SDK
    # ==================================================================
    - name: 3.1 Create and Package SDK Files
      run: |
        $SourceDir = "${{ github.workspace }}"
        $BuildDir = "${{ github.workspace }}/out/${{ matrix.output_dir_name }}"
        $DestinationDir = "${{ github.workspace }}/skia-sdk"

        # 清理并创建目录结构
        if (Test-Path $DestinationDir) {
            Remove-Item -Recurse -Force $DestinationDir
        }
        $SDKIncludeDir = Join-Path $DestinationDir "include"
        $SDKLibDir = Join-Path $DestinationDir "lib"
        $SDKBinDir = Join-Path $DestinationDir "bin"
        $SDKLicenseDir = Join-Path $DestinationDir "LICENSES"
        New-Item -ItemType Directory -Path $SDKIncludeDir, $SDKLibDir, $SDKBinDir, $SDKLicenseDir | Out-Null
        
        # 复制头文件
        Copy-Item -Path (Join-Path $SourceDir "include") -Destination $SDKIncludeDir -Recurse -Force
        Copy-Item -Path (Join-Path $SourceDir "modules") -Destination $SDKIncludeDir -Recurse -Force
        Copy-Item -Path (Join-Path $SourceDir "third_party/externals/dawn/include") -Destination (Join-Path $SDKIncludeDir "third_party/externals/dawn") -Recurse -Force
        Copy-Item -Path (Join-Path $BuildDir "gen/third_party/externals/dawn/include") -Destination (Join-Path $SDKIncludeDir "gen/third_party/externals/dawn") -Recurse -Force

        # 复制库和二进制文件
        if ($env:RUNNER_OS -eq "Windows") {
            Get-ChildItem -Path $BuildDir -Filter "*.lib" | Copy-Item -Destination $SDKLibDir
            Get-ChildItem -Path $BuildDir -Filter "*.dll" | Copy-Item -Destination $SDKBinDir
        } else {
            Get-ChildItem -Path $BuildDir -Filter "*.a" | Copy-Item -Destination $SDKLibDir
            Get-ChildItem -Path $BuildDir -Filter "*.so" | Copy-Item -Destination $SDKBinDir
        }
        Copy-Item -Path (Join-Path $BuildDir "icudtl.dat") -Destination $SDKBinDir -Force
        
        # 复制许可证文件
        Get-ChildItem -Path $SourceDir -Recurse -Include "LICENSE*", "COPYING*" | ForEach-Object {
            $DestFile = Join-Path $SDKLicenseDir "$($_.Directory.Name)-$($_.Name)"
            Copy-Item -Path $_.FullName -Destination $DestFile -Force
        }
      shell: pwsh
      
    - name: 3.2 Generate SkiaConfig.cmake (Windows)
      if: matrix.target_os == 'win'
      shell: pwsh
      run: |
        # 使用 PowerShell 的 Here-String (`@''@`) 定义多行内容
        $content = @'
        # Skia SDK CMake Config (Windows)
        get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
        add_library(Skia::Skia INTERFACE IMPORTED)
        target_include_directories(Skia::Skia INTERFACE 
            "${Skia_SELF_DIR}/include" 
            "${Skia_SELF_DIR}/include/third_party/externals/dawn" 
            "${Skia_SELF_DIR}/gen/third_party/externals/dawn")
        target_link_libraries(Skia::Skia INTERFACE 
            "${Skia_SELF_DIR}/lib/skia.lib" 
            "${Skia_SELF_DIR}/lib/skshaper.lib" 
            "${Skia_SELF_DIR}/lib/skunicode.lib" 
            "${Skia_SELF_DIR}/lib/dawn_native.dll.lib" 
            "${Skia_SELF_DIR}/lib/dawn_proc.dll.lib"
            d3d11.lib d3d12.lib dxguid.lib)
        target_compile_definitions(Skia::Skia INTERFACE SK_BUILD_FOR_WIN)
        message(STATUS "Found Skia SDK for Windows")
        '@
        Set-Content -Path "${{ github.workspace }}/skia-sdk/SkiaConfig.cmake" -Value $content

    - name: 3.3 Generate SkiaConfig.cmake (Linux)
      if: matrix.target_os == 'linux'
      shell: bash
      run: |
        # 使用 Bash 的 Here-Document (`<<'EOF'`) 定义多行内容
        cat << 'EOF' > ${{ github.workspace }}/skia-sdk/SkiaConfig.cmake
        # Skia SDK CMake Config (Linux)
        get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
        add_library(Skia::Skia INTERFACE IMPORTED)
        target_include_directories(Skia::Skia INTERFACE 
            "${Skia_SELF_DIR}/include" 
            "${Skia_SELF_DIR}/include/third_party/externals/dawn" 
            "${Skia_SELF_DIR}/gen/third_party/externals/dawn")
        target_link_libraries(Skia::Skia INTERFACE 
            "${Skia_SELF_DIR}/lib/libskia.a" 
            "${Skia_SELF_DIR}/lib/libskshaper.a" 
            "${Skia_SELF_DIR}/lib/libskunicode.a" 
            "${Skia_SELF_DIR}/bin/libdawn_native.so" 
            "${Skia_SELF_DIR}/bin/libdawn_proc.so"
            fontconfig freetype harfbuzz EGL GLESv2 X11 dl pthread)
        message(STATUS "Found Skia SDK for Linux")
        EOF

    - name: 3.4 Generate SkiaConfig.cmake (Android)
      if: matrix.target_os == 'android'
      shell: bash
      run: |
        cat << 'EOF' > ${{ github.workspace }}/skia-sdk/SkiaConfig.cmake
        # Skia SDK CMake Config (Android)
        get_filename_component(Skia_SELF_DIR "${CMAKE_CURRENT_LIST_FILE}" DIRECTORY)
        add_library(Skia::Skia INTERFACE IMPORTED)
        target_include_directories(Skia::Skia INTERFACE 
            "${Skia_SELF_DIR}/include" 
            "${Skia_SELF_DIR}/include/third_party/externals/dawn" 
            "${Skia_SELF_DIR}/gen/third_party/externals/dawn")
        target_link_libraries(Skia::Skia INTERFACE 
            "${Skia_SELF_DIR}/lib/libskia.a" 
            "${Skia_SELF_DIR}/lib/libskshaper.a" 
            "${Skia_SELF_DIR}/lib/libskunicode.a" 
            "${Skia_SELF_DIR}/bin/libdawn_native.so" 
            "${Skia_SELF_DIR}/bin/libdawn_proc.so"
            log android EGL GLESv2)
        message(STATUS "Found Skia SDK for Android")
        EOF

    # ==================================================================
    #   步骤 4: 上传构件
    # ==================================================================
    - name: 4.1 Upload SDK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: skia-sdk-${{ matrix.name }}
        path: skia-sdk/
