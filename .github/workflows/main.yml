# .github/workflows/build-skia-sdk.yml

name: Build Skia SDK Weekly

on:
  # 允许手动从 GitHub Actions 页面触发此工作流
  workflow_dispatch:
  # 每周日凌晨 3:15 (UTC) 自动触发
  schedule:
    - cron: '15 3 * * 0'

jobs:
  build_skia:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      # 禁止在一个任务失败时取消其他所有任务
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target_os: win
            target_cpu: x64
            output_dir_name: Release-Clang-Optimized-Win
            gn_args: >
              is_official_build = true
              is_debug = false
              target_os = "win"
              target_cpu = "x64"
              cc = "clang"
              cxx = "clang++"
              clang_win = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64"
              win_vc = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC"
              win_sdk = "C:/Program Files (x86)/Windows Kits/10"
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_pdf_subset_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_ganesh = false
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_d3d11 = true
              dawn_enable_d3d12 = true
              dawn_enable_vulkan = true
              extra_cflags_c = [ "/MT" ]
              extra_cflags_cc = [ "/MT", "/std:c++20" ]
              extra_ldflags = [ "/OPT:ICF", "/OPT:REF" ]

          - name: linux-x64
            runner: ubuntu-latest
            target_os: linux
            target_cpu: x64
            output_dir_name: Release-Clang-Optimized-Linux
            gn_args: >
              is_official_build = true
              is_debug = false
              target_os = "linux"
              target_cpu = "x64"
              cc = "clang"
              cxx = "clang++"
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_ganesh = false
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_vulkan = true
              dawn_enable_opengles = true
              dawn_use_x11 = true
              extra_cflags_cc = [ "-std=c++20", "-fno-exceptions" ]
              
          - name: android-arm64
            runner: ubuntu-latest
            target_os: android
            target_cpu: arm64
            output_dir_name: Release-Clang-Optimized-Android
            gn_args: >
              is_official_build = true
              is_debug = false
              target_os = "android"
              target_cpu = "arm64"
              ndk = "/usr/local/lib/android/sdk/ndk-bundle"
              skia_use_freetype = true
              skia_use_harfbuzz = true
              skia_enable_skottie = true
              skia_enable_svg = true
              skia_enable_ganesh = false
              skia_enable_graphite = true
              skia_use_dawn = true
              dawn_enable_vulkan = true
              dawn_enable_opengles = true
              extra_cflags_cc = [ "-std=c++20", "-fno-exceptions" ]

    steps:
    # ==================================================================
    #   步骤 1: 准备环境和依赖
    # ==================================================================
    - name: 1.1 Checkout Code
      uses: actions/checkout@v4
      with:
        path: skia-build-script # 将此仓库代码检出到子目录

    - name: 1.2 Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev libxrandr-dev libx11-xcb-dev libxcb-dri3-dev libxrender-dev libxshmfence-dev

    - name: 1.3 Setup depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$(pwd)/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: 1.4 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # ==================================================================
    #   步骤 2: 获取 Skia 源代码
    # ==================================================================
    - name: 2.1 Fetch Skia Source Code
      run: |
        gclient config --unmanaged --name=skia https://skia.googlesource.com/skia.git
        gclient sync
      working-directory: .

    # ==================================================================
    #   步骤 3: 配置并编译 Skia
    # ==================================================================
    - name: 3.1 Configure Skia Build (gn)
      run: |
        echo "${{ matrix.gn_args }}" > out/${{ matrix.output_dir_name }}/args.gn
        python3 tools/git-sync-deps
        gn gen out/${{ matrix.output_dir_name }}
      working-directory: skia
      shell: bash

    - name: 3.2 Compile Skia (ninja)
      run: ninja -C out/${{ matrix.output_dir_name }}
      working-directory: skia

    # ==================================================================
    #   步骤 4: 打包为 SDK
    # ==================================================================
    - name: 4.1 Create and Package SDK
      # 使用 skia-build-script 目录下的 ps1 脚本来执行打包
      # 注意：原始脚本中的路径和部分逻辑已通过矩阵变量和工作流步骤适配
      run: |
        $scriptPath = "${{ github.workspace }}/skia-build-script/your-script-name.ps1" # 请替换为您的脚本文件名
        
        # 为了在 Linux 上运行，需要将 PowerShell 脚本转换为 Shell 脚本
        # 这里我们直接在 workflow 中实现打包逻辑，以保证跨平台兼容性
        
        $SourceDir = "${{ github.workspace }}/skia"
        $BuildDir = "${{ github.workspace }}/skia/out/${{ matrix.output_dir_name }}"
        $DestinationDir = "${{ github.workspace }}/skia-sdk"

        # 清理并创建目录
        if (Test-Path $DestinationDir) {
            Remove-Item -Recurse -Force $DestinationDir
        }
        $SDKIncludeDir = Join-Path $DestinationDir "include"
        $SDKLibDir = Join-Path $DestinationDir "lib"
        $SDKBinDir = Join-Path $DestinationDir "bin"
        $SDKLicenseDir = Join-Path $DestinationDir "LICENSES"
        New-Item -ItemType Directory -Path $SDKIncludeDir, $SDKLibDir, $SDKBinDir, $SDKLicenseDir | Out-Null
        
        # 复制头文件
        Copy-Item -Path (Join-Path $SourceDir "include") -Destination $SDKIncludeDir -Recurse -Force
        Copy-Item -Path (Join-Path $SourceDir "modules") -Destination $SDKIncludeDir -Recurse -Force
        Copy-Item -Path (Join-Path $SourceDir "third_party/externals/dawn/include") -Destination (Join-Path $SDKIncludeDir "third_party/externals/dawn") -Recurse -Force
        $GenDawnInclude = Join-Path $BuildDir "gen/third_party/externals/dawn/include"
        Copy-Item -Path $GenDawnInclude -Destination (Join-Path $SDKIncludeDir "gen/third_party/externals/dawn") -Recurse -Force

        # 复制库和二进制文件
        if ($env:RUNNER_OS -eq "Windows") {
            Copy-Item -Path (Join-Path $BuildDir "*.lib") -Destination $SDKLibDir -Force
            Copy-Item -Path (Join-Path $BuildDir "*.dll") -Destination $SDKBinDir -Force
        } else {
            Copy-Item -Path (Join-Path $BuildDir "*.a") -Destination $SDKLibDir -Force
            Copy-Item -Path (Join-Path $BuildDir "*.so") -Destination $SDKBinDir -Force
        }
        Copy-Item -Path (Join-Path $BuildDir "icudtl.dat") -Destination $SDKBinDir -Force

        # 复制许可证
        Get-ChildItem -Path $SourceDir -Recurse -Include "LICENSE*", "COPYING*" | ForEach-Object {
            $DestFile = Join-Path $SDKLicenseDir "$($_.Directory.Name)-$($_.Name)"
            Copy-Item -Path $_.FullName -Destination $DestFile -Force
        }
      shell: pwsh
      
    - name: 4.2 Generate SkiaConfig.cmake
      # 此步骤应根据平台生成不同的 CMake 配置文件
      # 为简化起见，此处仅演示 Windows 版本，实际应用中需要为各平台适配
      run: |
        $cmakeConfigContent = Get-Content "${{ github.workspace }}/skia-build-script/your-script-name.ps1" | Out-String
        # 提取 CMake 内容的逻辑会比较复杂，建议将 CMake 模板单独存放
        # 此处仅做占位符
        echo "set(Skia_MESSAGE 'CMake config generation needs to be adapted per-platform')" > ${{ github.workspace }}/skia-sdk/SkiaConfig.cmake
      shell: pwsh

    # ==================================================================
    #   步骤 5: 上传构件
    # ==================================================================
    - name: 5.1 Upload SDK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: skia-sdk-${{ matrix.name }}
        path: skia-sdk/
